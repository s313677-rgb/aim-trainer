<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰術模擬：實體機械 3D 靶場 v2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080810;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
        }

        #game-container {
            display: flex;
            gap: 25px;
            background-color: #13131c;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #222533;
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 230px;
        }

        .status-box {
            background-color: #09090f;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 16px;
            border-left: 5px solid #00ffcc;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        .status-box span {
            font-weight: bold;
            color: #f1c40f;
            font-family: 'Courier New', Courier, monospace;
        }

        .time-warning {
            color: #ff3838 !important;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.4; }
        }

        canvas {
            background-color: #020205;
            border: 3px solid #1f2230;
            border-radius: 12px;
            cursor: crosshair;
        }

        #leaderboard {
            background-color: #09090f;
            padding: 15px;
            border-radius: 10px;
            flex-grow: 1;
            margin-bottom: 15px;
            border: 1px solid #1f2230;
        }

        #leaderboard h3 {
            margin-top: 0;
            color: #00ffcc;
            border-bottom: 2px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 8px;
            font-size: 16px;
        }

        ol {
            padding-left: 20px;
            margin: 10px 0 0 0;
        }

        li {
            margin-bottom: 8px;
            font-size: 14px;
            color: #a2a2c2;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            color: #05050a;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5);
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 8, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #modal {
            background: #13131c;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #00ffcc;
        }

        #modal input {
            padding: 12px;
            width: 80%;
            margin: 18px 0;
            border: 1px solid #222533;
            background: #09090f;
            color: #fff;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>TACTICAL SIMULATOR：3D 實境靶場 🎯</h1>
    
    <div id="game-container">
        <canvas id="aimCanvas" width="600" height="600"></canvas>

        <div id="info-panel">
            <div>
                <div class="status-box">目前關卡: <span id="lblLevel">1</span> / 5</div>
                <div class="status-box">當前分數: <span id="lblScore">0</span></div>
                <div class="status-box">擊中目標: <span id="lblTarget">0 / 10</span></div>
                <div class="status-box">精準度: <span id="lblAccuracy">100</span>%</div>
                <div class="status-box">剩餘時間: <span id="lblTime">120.00</span> 秒</div>
            </div>

            <div id="leaderboard">
                <h3>🏆 頂尖神射手排行</h3>
                <ol id="leaderList">
                    <li>暫無資料</li>
                </ol>
            </div>
            
            <button class="btn" id="btnStart" onclick="startGame()">開啟 3D 實體模擬</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">訓練結束</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6; color: #ced4da;"></p>
            <div id="name-input-area" style="display:none;">
                <input type="text" id="playerName" placeholder="請輸入你的代號" maxlength="8">
            </div>
            <button class="btn" id="modalBtn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let level = 1;
        let hitsInLevel = 0;
        let totalClicks = 0;
        let successfulHits = 0;
        let startTime = 0;
        let timeLeft = 120; 
        
        let isPlaying = false;
        let targetTimeout;
        let timerInterval;

        // 3D 投影參數
        const vpX = 300;
        const vpY = 300;
        const fov = 300; 

        // 3D 世界坐標
        let target3D = { x: 0, y: 50, z: 500, baseRadius: 40 };

        // 大廳專屬動畫變數
        let lobbyAnimationId;
        let scanZ = 200; // 掃描網初始深度
        let scanDirection = 1; 
        let particles = [];

        // 初始化大廳浮游粒子
        for(let i=0; i<25; i++) {
            particles.push({
                x: Math.random() * 500 - 250,
                y: Math.random() * 500 - 250,
                z: Math.random() * 800 + 200,
                speed: Math.random() * 2 + 1
            });
        }

        const levelSettings = {
            1: { requiredHits: 10, radius: 45, duration: 1500 },
            2: { requiredHits: 12, radius: 40, duration: 1200 },
            3: { requiredHits: 15, radius: 36, duration: 950 },
            4: { requiredHits: 18, radius: 32, duration: 750 },
            5: { requiredHits: 20, radius: 28, duration: 550 }
        };

        function resetGame() {
            score = 0;
            level = 1;
            hitsInLevel = 0;
            totalClicks = 0;
            successfulHits = 0;
            timeLeft = 120;
            document.getElementById("lblTime").classList.remove("time-warning");
            updateUI();
        }

        function startGame() {
            if (isPlaying) return;
            
            // 停止大廳動畫循環
            cancelAnimationFrame(lobbyAnimationId);
            
            resetGame();
            isPlaying = true;
            
            document.getElementById("btnStart").disabled = true;
            document.getElementById("btnStart").style.background = "#333";
            document.getElementById("btnStart").style.color = "#666";
            
            startTime = performance.now();
            
            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - startTime) / 1000;
                timeLeft = (120 - elapsed).toFixed(2);
                if (timeLeft <= 20) document.getElementById("lblTime").classList.add("time-warning");
                if (timeLeft <= 0) {
                    timeLeft = "0.00";
                    endGame(false, true);
                    return;
                }
                document.getElementById("lblTime").innerText = timeLeft;
            }, 10);

            spawnTarget();
        }

        function spawnTarget() {
            if (!isPlaying) return;
            clearTimeout(targetTimeout);

            const settings = levelSettings[level];
            target3D.z = Math.random() * (900 - 220) + 220;
            target3D.baseRadius = settings.radius;

            const maxW = 210;
            target3D.x = Math.random() * (maxW * 2) - maxW;
            target3D.y = Math.random() * (180 - (-50)) + (-50);

            drawCanvas();

            targetTimeout = setTimeout(() => {
                spawnTarget();
            }, settings.duration);
        }

        function project(x, y, z) {
            const scale = fov / z;
            return { x: vpX + x * scale, y: vpY + y * scale, scale: scale };
        }

        // 大廳專屬的動畫更新 loop
        function updateLobby() {
            if (isPlaying) return;

            // 1. 更新大廳雷射掃描網深度
            scanZ += scanDirection * 4;
            if (scanZ > 950 || scanZ < 200) {
                scanDirection *= -1;
            }

            // 2. 更新浮游全息粒子
            particles.forEach(p => {
                p.z -= p.speed;
                if (p.z < 150) {
                    p.z = 1000;
                    p.x = Math.random() * 500 - 250;
                    p.y = Math.random() * 500 - 250;
                }
            });

            // 3. 繪製畫面
            drawCanvas();

            lobbyAnimationId = requestAnimationFrame(updateLobby);
        }

        function drawCanvas() {
            // 背景清空
            ctx.fillStyle = "#020206";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const size = 250; 

            // 1. 遠方盡頭陰影
            const farPos = project(0, 0, 1000);
            const farSize = size * farPos.scale;
            ctx.fillStyle = "#000003";
            ctx.fillRect(vpX - farSize, vpY - farSize, farSize * 2, farSize * 2);
            ctx.strokeStyle = "rgba(0, 255, 204, 0.15)";
            ctx.strokeRect(vpX - farSize, vpY - farSize, farSize * 2, farSize * 2);

            // 2. 繪製 3D 網格縱深隧道
            const zStrips = [1000, 750, 560, 420, 310, 230, 170];
            for (let i = 0; i < zStrips.length - 1; i++) {
                const zFar = zStrips[i];
                const zNear = zStrips[i + 1];

                const pFar = project(0, 0, zFar);
                const pNear = project(0, 0, zNear);

                const sFar = size * pFar.scale;
                const sNear = size * pNear.scale;

                const alpha = (1 - (zNear / 1000)) * 0.35;
                ctx.strokeStyle = `rgba(0, 255, 204, ${alpha})`;
                ctx.lineWidth = (1 - (zNear / 1000)) * 2;

                ctx.strokeRect(vpX - sNear, vpY - sNear, sNear * 2, sNear * 2);

                ctx.beginPath();
                ctx.moveTo(vpX - sNear, vpY - sNear); ctx.lineTo(vpX - sFar, vpY - sFar);
                ctx.moveTo(vpX + sNear, vpY - sNear); ctx.lineTo(vpX + sFar, vpY - sFar);
                ctx.moveTo(vpX - sNear, vpY + sNear); ctx.lineTo(vpX - sFar, vpY + sFar);
                ctx.moveTo(vpX + sNear, vpY + sNear); ctx.lineTo(vpX + sFar, vpY + sFar);
                
                ctx.moveTo(vpX - sNear * 0.5, vpY + sNear); ctx.lineTo(vpX - sFar * 0.5, vpY + sFar);
                ctx.moveTo(vpX + sNear * 0.5, vpY + sNear); ctx.lineTo(vpX + sFar * 0.5, vpY + sFar);
                ctx.stroke();
            }

            // 🌟 大廳限定：繪製 3D 浮游微粒
            if (!isPlaying) {
                particles.forEach(p => {
                    const pt = project(p.x, p.y, p.z);
                    if (pt.x > 0 && pt.x < 600 && pt.y > 0 && pt.y < 600) {
                        const pSize = Math.max(0.5, 2.5 * pt.scale);
                        const pAlpha = Math.max(0, (1 - p.z / 1000) * 0.6);
                        ctx.fillStyle = `rgba(0, 255, 204, ${pAlpha})`;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, pSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // 🌟 大廳限定：繪製 3D 來回穿梭的雷射掃描網
                const scanPos = project(0, 0, scanZ);
                const scanSize = size * scanPos.scale;
                const scanAlpha = Math.max(0, (1 - scanZ / 1000) * 0.25);
                ctx.strokeStyle = `rgba(0, 180, 255, ${scanAlpha})`;
                ctx.lineWidth = 2;
                ctx.strokeRect(vpX - scanSize, vpY - scanSize, scanSize * 2, scanSize * 2);
                
                // 給掃描網增加十字瞄準十字架
                ctx.beginPath();
                ctx.moveTo(vpX - scanSize, vpY); ctx.lineTo(vpX + scanSize, vpY);
                ctx.moveTo(vpX, vpY - scanSize); ctx.lineTo(vpX, vpY + scanSize);
                ctx.strokeStyle = `rgba(0, 180, 255, ${scanAlpha * 0.5})`;
                ctx.stroke();
            }

            // 3. 繪製 3D 實體靶架與投影
            const targetProj = project(target3D.x, target3D.y, target3D.z);
            const r = target3D.baseRadius * targetProj.scale;
            const floorY = vpY + size * targetProj.scale;

            // ⚙️ 支撐桿
            ctx.beginPath();
            ctx.moveTo(targetProj.x, targetProj.y);
            ctx.lineTo(targetProj.x, floorY); 
            ctx.strokeStyle = "rgba(40, 50, 70, 0.9)";
            ctx.lineWidth = Math.max(2, 6 * targetProj.scale);
            ctx.stroke();

            // ⚙️ 機械底座
            ctx.fillStyle = "#151922";
            ctx.fillRect(targetProj.x - r*0.3, floorY - r*0.1, r*0.6, r*0.2);

            // ⚙️ 地板投影陰影
            ctx.beginPath();
            const shadowOpacity = Math.max(0, (1 - target3D.z / 1000) * 0.5);
            ctx.ellipse(targetProj.x, floorY, r, r * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${shadowOpacity})`;
            ctx.fill();

            // ⚙️ 靶面壓扁計算
            let radiusX = r, radiusY = r;
            const xRatio = target3D.x / size; 
            const yRatio = target3D.y / size;
            if (Math.abs(xRatio) > 0.35 && Math.abs(xRatio) > Math.abs(yRatio)) {
                radiusX = r * (1 - Math.abs(xRatio) * 0.35);
            } else if (yRatio < -0.35) {
                radiusY = r * (1 - Math.abs(yRatio) * 0.35);
            }

            // 4. 繪製霓虹靶面
            ctx.shadowBlur = Math.max(5, 25 * targetProj.scale);
            ctx.shadowColor = "#00ffcc";
            ctx.beginPath();
            ctx.ellipse(targetProj.x, targetProj.y, radiusX, radiusY, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.shadowBlur = 0; 

            ctx.beginPath();
            ctx.ellipse(targetProj.x, targetProj.y, radiusX * 0.65, radiusY * 0.65, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#111116";
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(targetProj.x, targetProj.y, radiusX * 0.28, radiusY * 0.28, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#ff3838";
            ctx.fill();

            // 🌟 大廳限定：頂部戰術 HUD 邊框與「大廳待機中」文字 UI
            if (!isPlaying) {
                // 四角戰術框 HUD
                ctx.strokeStyle = "rgba(0, 255, 204, 0.4)";
                ctx.lineWidth = 2;
                const len = 25; // 邊框長度
                const pad = 15; // 邊界留白
                
                // 左上角
                ctx.beginPath(); ctx.moveTo(pad, pad+len); ctx.lineTo(pad, pad); ctx.lineTo(pad+len, pad); ctx.stroke();
                // 右上角
                ctx.beginPath(); ctx.moveTo(600-pad, pad+len); ctx.lineTo(600-pad, pad); ctx.lineTo(600-pad-len, pad); ctx.stroke();
                // 左下角
                ctx.beginPath(); ctx.moveTo(pad, 600-pad-len); ctx.lineTo(pad, 600-pad); ctx.lineTo(pad+len, 600-pad); ctx.stroke();
                // 右下角
                ctx.beginPath(); ctx.moveTo(600-pad, 600-pad-len); ctx.lineTo(600-pad, 600-pad); ctx.lineTo(600-pad-len, 600-pad); ctx.stroke();

                // 中央上方文字提示 (帶有呼吸燈跳動效果)
                const pulse = Math.abs(Math.sin(performance.now() / 300));
                ctx.fillStyle = `rgba(0, 255, 204, ${0.4 + pulse * 0.6})`;
                ctx.font = "bold 15px 'Segoe UI', monospace";
                ctx.textAlign = "center";
                ctx.fillText("[ SYSTEM READY : WAITING IN LOBBY ]", 300, 45);
                
                // 下方操作說明
                ctx.fillStyle = "rgba(162, 162, 194, 0.7)";
                ctx.font = "13px 'Segoe UI'";
                ctx.fillText("請點擊右側「開啟 3D 實體模擬」按鈕解鎖靶場", 300, 560);
            }
        }

        // 開槍判定
        canvas.addEventListener("mousedown", (e) => {
            if (!isPlaying) return;

            totalClicks++;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const targetProj = project(target3D.x, target3D.y, target3D.z);
            const r = target3D.baseRadius * targetProj.scale;

            const xRatio = target3D.x / 250;
            const yRatio = target3D.y / 250;
            let rx = r, ry = r;
            if (Math.abs(xRatio) > 0.35 && Math.abs(xRatio) > Math.abs(yRatio)) {
                rx = r * (1 - Math.abs(xRatio) * 0.35);
            } else if (yRatio < -0.35) {
                ry = r * (1 - Math.abs(yRatio) * 0.35);
            }

            const clickDist = ((mouseX - targetProj.x) ** 2) / (rx ** 2) + ((mouseY - targetProj.y) ** 2) / (ry ** 2);

            if (clickDist <= 1.0) {
                successfulHits++;
                hitsInLevel++;
                
                let distanceBonus = Math.round((target3D.z - 200) / 18);
                score += (level * 10) + Math.max(0, distanceBonus); 

                const req = levelSettings[level].requiredHits;
                if (hitsInLevel >= req) {
                    if (level < 5) nextLevel();
                    else endGame(true, false);
                } else {
                    spawnTarget(); 
                }
            } else {
                score = Math.max(0, score - 5);
                drawFlashBorder(); 
            }
            updateUI();
        });

        function nextLevel() {
            level++;
            hitsInLevel = 0;
            updateUI();

            ctx.fillStyle = "rgba(0, 255, 204, 0.35)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            isPlaying = false;
            setTimeout(() => {
                if(totalClicks > 0 && timeLeft > 0) { 
                    isPlaying = true;
                    spawnTarget();
                }
            }, 300);
        }

        function drawFlashBorder() {
            ctx.strokeStyle = "rgba(255, 56, 56, 0.5)";
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        function updateUI() {
            const req = levelSettings[level] ? levelSettings[level].requiredHits : 0;
            document.getElementById("lblLevel").innerText = level;
            document.getElementById("lblScore").innerText = score;
            document.getElementById("lblTarget").innerText = `${hitsInLevel} / ${req}`;
            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            document.getElementById("lblAccuracy").innerText = accuracy;
        }

        function endGame(isWin, isTimeOut = false) {
            isPlaying = false;
            clearTimeout(targetTimeout);
            clearInterval(timerInterval);
            
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStart").style.background = "linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%)";
            document.getElementById("btnStart").style.color = "#05050a";

            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            let title = isWin ? "⚡ 3D 戰術特訓全通關！" : "⏰ 時間截止！";
            const timeUsed = (120 - parseFloat(timeLeft)).toFixed(2);
            let desc = `最終得分：${score} 分\n通關進度：第 ${level} 關\n總計耗時：${timeUsed} 秒\n射擊精準度：${accuracy}%`;
            
            document.getElementById("modal-title").innerText = title;
            if (checkHighScore(score)) {
                desc += "\n\n成功登入神射手榜！請輸入代號：";
                document.getElementById("name-input-area").style.display = "block";
            } else {
                document.getElementById("name-input-area").style.display = "none";
            }
            
            document.getElementById("modal-desc").innerText = desc;
            document.getElementById("modal-overlay").style.display = "flex";
            
            // 重新回到大廳並重啟動態特效
            target3D = { x: 0, y: 50, z: 500, baseRadius: 40 };
            updateLobby(); 
        }

        function closeModal() {
            const nameInput = document.getElementById("playerName");
            if (document.getElementById("name-input-area").style.display === "block") {
                const name = nameInput.value.trim() || "Ranger";
                saveHighScore(name, score);
                nameInput.value = "";
            }
            document.getElementById("modal-overlay").style.display = "none";
            showLeaderboard();
        }

        function getLeaderboard() {
            const board = localStorage.getItem("aim_leaderboard_v5_3d");
            return board ? JSON.parse(board) : [];
        }

        function checkHighScore(currentScore) {
            if (currentScore === 0) return false;
            const board = getLeaderboard();
            if (board.length < 5) return true;
            return currentScore > board[board.length - 1].score;
        }

        function saveHighScore(name, currentScore) {
            let board = getLeaderboard();
            board.push({name: name, score: currentScore, date: new Date().toLocaleDateString()});
            board.sort((a, b) => b.score - a.score);
            board = board.slice(0, 5);
            localStorage.setItem("aim_leaderboard_v5_3d", JSON.stringify(board));
        }

        function showLeaderboard() {
            const board = getLeaderboard();
            const listEl = document.getElementById("leaderList");
            listEl.innerHTML = "";
            if (board.length === 0) {
                listEl.innerHTML = "<li>暫無資料</li>";
                return;
            }
            board.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = `<strong>${item.name}</strong> - ${item.score} 點 (${item.date})`;
                listEl.appendChild(li);
            });
        }

        // 啟動初始大廳動態循環
        updateLobby();
        showLeaderboard();
    </script>
</body>
</html>

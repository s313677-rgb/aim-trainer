<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACTICAL SIMULATOR 3D - GITHUB P2P EDITION</title>
    <!-- 引入 PeerJS：實現 GitHub 靜態網頁免伺服器 P2P 連線 -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #06060c;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
            font-size: 24px;
        }

        #game-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1100px;
            width: 100%;
        }

        #control-panel {
            background-color: #11111a;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #1f2233;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .panel-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-label {
            font-size: 13px;
            color: #8a8a9e;
            font-weight: bold;
        }

        select, .panel-input {
            background-color: #05050a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        
        .panel-input { width: 100px; color: #fff; border: 1px solid #222533; text-align: center;}
        .panel-input:focus { border-color: #00ffcc; }

        .btn-sm {
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            color: #05050a;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-sm:hover { opacity: 0.9; }
        .btn-net { background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); color: white; }

        #game-container {
            display: flex;
            gap: 20px;
            background-color: #11111a;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #1f2233;
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 240px;
            flex-shrink: 0;
        }

        .status-box {
            background-color: #05050a;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 7px;
            font-size: 13px;
            border-left: 4px solid #00ffcc;
        }
        .status-box span { font-weight: bold; color: #f1c40f; font-family: monospace; }
        .net-status { border-left-color: #ffaa00 !important; }

        .canvas-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
            background: #020205;
            padding: 10px;
            border-radius: 14px;
            border: 1px solid #1a1d29;
        }

        canvas { background-color: #010103; border: 2px solid #1a1d29; border-radius: 8px; }
        #aimCanvas { cursor: crosshair; }

        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            color: #05050a;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4); }
        .btn:disabled { background: #333 !important; color: #666 !important; transform: none !important; }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 8, 0.95); justify-content: center; align-items: center; z-index: 10;
        }
        #modal { background: #11111a; padding: 35px; border-radius: 16px; text-align: center; border: 2px solid #00ffcc; max-width: 400px; width: 90%; }
        .user-badge { color: #00ffcc !important; }
        .opp-badge { color: #ff9900 !important; }
        #net-msg { font-size: 13px; font-weight: bold; color: #ffaa00; }
    </style>
</head>
<body>

    <h1>TACTICAL SIMULATOR：GitHub 免費 P2P 線上對決 🌐</h1>
    
    <div id="game-layout">
        <div id="control-panel">
            <div class="panel-row">
                <div class="panel-section">
                    <div class="panel-label">模擬難度：</div>
                    <select id="selectDifficulty">
                        <option value="easy">簡單模式</option>
                        <option value="normal" selected>普通規格</option>
                        <option value="hard">高度困難</option>
                    </select>
                </div>
                <div class="panel-section">
                    <span class="panel-label">我的連線 ID：</span>
                    <span id="my-peer-id" style="color: #00ffcc; font-weight: bold; font-family: monospace;">連線中...</span>
                    <span id="net-msg">📡 正在初始化 P2P 組件...</span>
                </div>
            </div>

            <!-- ⚔ P2P 連線大廳 -->
            <div class="panel-row" style="border-top: 1px dashed #222533; padding-top: 10px;">
                <div class="panel-section">
                    <span class="panel-label" style="color: #ffaa00;">好友開房：</span>
                    <button class="btn-sm btn-net" onclick="createRoom()">生成房號(分享給朋友)</button>
                    <input type="text" id="joinIdInput" class="panel-input" placeholder="輸入朋友房號" maxlength="5">
                    <button class="btn-sm" style="background: #ffaa00;" onclick="joinRoom()">進房 PK</button>
                </div>
                <div class="panel-section">
                    <span class="panel-label" style="color: #00b3ff;">大廳匹配：</span>
                    <button class="btn-sm" style="background: linear-gradient(135deg, #00b3ff 0%, #8800ff 100%); color:white;" id="btnMatch" onclick="startMatchmaking()">線上隨機匹配</button>
                </div>
            </div>
        </div>

        <div id="game-container">
            <div class="canvas-wrapper">
                <canvas id="ghostCanvas" width="380" height="450"></canvas>
                <canvas id="aimCanvas" width="380" height="450"></canvas>
            </div>

            <div id="info-panel">
                <div>
                    <div class="status-box"><span class="user-badge">我的狀態</span>: <span id="lblUser">未連線</span></div>
                    <div class="status-box net-status"><span class="opp-badge">線上對手</span>: <span id="lblOpponent">等待中...</span></div>
                    <div class="status-box net-status"><span>連線模式</span>: <span id="lblRoomState">單機練習</span></div>
                    <div class="status-box"><span>目前關卡</span>: <span id="lblLevel">1</span> / 5</div>
                    <div class="status-box"><span>我的分數</span>: <span id="lblScore">0</span></div>
                    <div class="status-box net-status"><span class="opp-badge">對手分數</span>: <span id="lblOpponentScore">0</span></div>
                    <div class="status-box"><span>剩餘時間</span>: <span id="lblTime">120.00</span></div>
                </div>
                <button class="btn" id="btnStart" onclick="localPracticeStart()">開啟單機練習</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title" style="color:#00ffcc;">戰術結算</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6; color: #ced4da; margin-bottom: 15px;"></p>
            <button class="btn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas"); const ctx = canvas.getContext("2d");
        const ghostCanvas = document.getElementById("ghostCanvas"); const gCtx = ghostCanvas.getContext("2d");

        // 遊戲核心變數
        let score = 0, level = 1, hitsInLevel = 0, timeLeft = 120, isPlaying = false, targetTimeout, timerInterval;
        const vpX = 190, vpY = 225, fov = 250;
        let target3D = { x: 0, y: 30, z: 500, baseRadius: 30 };

        // 🌐 P2P 連線核心變數
        let peer = null;
        let conn = null; // P2P 資料傳輸通道
        let myId = "";
        let isMultiplayer = false;
        let oppScore = 0, oppLevel = 1;
        let oppTarget3D = { x: 0, y: 30, z: 500, baseRadius: 30 };
        let oppLaserTimer = 0, oppMouse = { x: 190, y: 225 };

        const difficultySettings = {
            easy:     { gameTime: 120, reqHits: [8, 8, 10, 10, 10], radius: [45, 40, 36, 32, 28], duration: [2000, 1800, 1600, 1400, 1200], missPenalty: 2 },
            normal:   { gameTime: 90,  reqHits: [10, 10, 12, 12, 15], radius: [36, 32, 28, 24, 20], duration: [1500, 1300, 1100, 950,  800], missPenalty: 5 },
            hard:     { gameTime: 60,  reqHits: [12, 12, 15, 15, 20], radius: [28, 25, 22, 19, 16], duration: [1100, 950,  800,  650,  550], missPenalty: 10 }
        };

        function getDiff() { return document.getElementById("selectDifficulty").value; }

        // -------------------------------------------------------------
        // 📡 PeerJS P2P 連線引擎
        // -------------------------------------------------------------
        // 初始化 Peer，隨機產生一個 5 位數的簡短房號
        myId = Math.floor(10000 + Math.random() * 89999).toString();
        peer = new Peer(myId);

        peer.on('open', (id) => {
            document.getElementById("my-peer-id").innerText = id;
            document.getElementById("net-msg").innerText = "📡 P2P 雲端就緒，隨時可開房！";
            document.getElementById("lblUser").innerText = "玩家已就緒";
        });

        // 被動接收別人的連線邀請 (當朋友輸入你的代碼進房時)
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupConnection();
            document.getElementById("lblRoomState").innerText = "好友對決房";
            document.getElementById("net-msg").innerText = "⚔️ 朋友已進房！對決準備開始...";
            
            // 房主發送起始訊號
            setTimeout(() => {
                sendNetData("START_GAME", { difficulty: getDiff() });
                startRealGame();
            }, 1500);
        });

        // 1. 自行開房：直接把畫面上的 ID 當成房號告訴朋友
        function createRoom() {
            alert(`你的專屬房號是：【 ${myId} 】\n請把這個號碼傳給朋友，等朋友輸入進房即可開戰！`);
        }

        // 2. 輸入代碼進房
        function joinRoom() {
            const peerId = document.getElementById("joinIdInput").value.trim();
            if(!peerId) { alert("請輸入朋友的5位數房號"); return; }
            
            document.getElementById("net-msg").innerText = "正在連線到朋友的房間...";
            conn = peer.connect(peerId);
            setupConnection();
            document.getElementById("lblRoomState").innerText = "好友對決房";
        }

        // 3. 線上隨機匹配（利用 PeerJS 公共伺服器的小技巧）
        function startMatchmaking() {
            document.getElementById("net-msg").innerText = "🔍 正在盲刷全網隨機房間中...";
            let attempts = 0;
            
            function tryConnect() {
                attempts++;
                if (attempts > 10) {
                    document.getElementById("net-msg").innerText = "❌ 暫時沒遇到線上玩家，先建立房間等別人吧！";
                    createRoom();
                    return;
                }
                // 隨機猜測可能的 5 位數 ID 進行碰撞匹配
                let guestId = Math.floor(10000 + Math.random() * 89999).toString();
                if (guestId === myId) { tryConnect(); return; }

                let testConn = peer.connect(guestId);
                let timeout = setTimeout(() => {
                    testConn.close();
                    tryConnect();
                }, 400); // 快速碰撞

                testConn.on('open', () => {
                    clearTimeout(timeout);
                    conn = testConn;
                    setupConnection();
                    document.getElementById("lblRoomState").innerText = "隨機匹配對決";
                    document.getElementById("net-msg").innerText = "⚔️ 成功撞車線上隨機對手！";
                    setTimeout(() => {
                        sendNetData("START_GAME", { difficulty: getDiff() });
                        startRealGame();
                    }, 1000);
                });
            }
            tryConnect();
        }

        // 處理連線建立後的數據監聽
        function setupConnection() {
            isMultiplayer = true;
            document.getElementById("lblOpponent").innerText = "線上對手已連接";

            conn.on('data', (data) => {
                const msg = JSON.parse(data);
                
                if (msg.type === "START_GAME") {
                    document.getElementById("selectDifficulty").value = msg.payload.difficulty;
                    startRealGame();
                }
                if (msg.type === "UPDATE") {
                    oppScore = msg.payload.score;
                    oppLevel = msg.payload.level;
                    oppTarget3D = msg.payload.target3D;
                    document.getElementById("lblOpponentScore").innerText = oppScore;
                }
                if (msg.type === "CLICK") {
                    oppMouse.x = msg.payload.mx;
                    oppMouse.y = msg.payload.my;
                    oppLaserTimer = 6; // 觸發紅外線軌跡
                }
                if (msg.type === "SYNC_END") {
                    endGame(false);
                }
            });

            conn.on('close', () => {
                document.getElementById("net-msg").innerText = "📡 對手斷開連線";
                if(isPlaying) endGame(false);
            });
        }

        function sendNetData(type, payload) {
            if (conn && conn.open) {
                conn.send(JSON.stringify({ type: type, payload: payload }));
            }
        }

        // -------------------------------------------------------------
        // 🎮 遊戲核心邏輯
        // -------------------------------------------------------------
        function localPracticeStart() {
            isMultiplayer = false;
            document.getElementById("lblRoomState").innerText = "單機練習";
            document.getElementById("lblOpponent").innerText = "無 (單機)";
            startRealGame();
        }

        function startRealGame() {
            if (isPlaying) return;
            score = 0; level = 1; hitsInLevel = 0; oppScore = 0; oppLevel = 1; oppLaserTimer = 0;
            const cfg = difficultySettings[getDiff()];
            timeLeft = cfg.gameTime;

            document.getElementById("btnStart").disabled = true;
            document.getElementById("selectDifficulty").disabled = true;

            gameStartTime = performance.now();
            isPlaying = true;

            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - gameStartTime) / 1000;
                timeLeft = (cfg.gameTime - elapsed).toFixed(2);
                if (timeLeft <= 0) {
                    timeLeft = "0.00";
                    sendNetData("SYNC_END", {});
                    endGame();
                    return;
                }
                document.getElementById("lblTime").innerText = timeLeft;
                drawCanvas();
                drawGhostCanvas();
            }, 10);

            spawnTarget();
        }

        function spawnTarget() {
            if (!isPlaying) return;
            clearTimeout(targetTimeout);

            const cfg = difficultySettings[getDiff()];
            target3D.z = Math.random() * (850 - 220) + 220;
            target3D.baseRadius = cfg.radius[level - 1];
            target3D.x = Math.random() * (130 * 2) - 130;
            target3D.y = Math.random() * (130 - (-30)) + (-30);

            // 實時將新靶心推給對手
            if(isMultiplayer) syncToOpponent();

            targetTimeout = setTimeout(() => { spawnTarget(); }, cfg.duration[level - 1]);
        }

        function project(x, y, z) { return { x: vpX + x * (fov / z), y: vpY + y * (fov / z), scale: fov / z }; }

        canvas.addEventListener("mousedown", (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const targetProj = project(target3D.x, target3D.y, target3D.z);
            const r = target3D.baseRadius * targetProj.scale;
            const clickDist = ((mouseX - targetProj.x) ** 2) / (r ** 2) + ((mouseY - targetProj.y) ** 2) / (r ** 2);
            const cfg = difficultySettings[getDiff()];

            if (clickDist <= 1.0) {
                hitsInLevel++;
                let distanceBonus = Math.round((target3D.z - 200) / 15);
                score += (level * 10) + Math.max(0, distanceBonus); 

                if (hitsInLevel >= cfg.reqHits[level - 1]) {
                    if (level < 5) { level++; hitsInLevel = 0; } 
                    else { 
                        sendNetData("SYNC_END", {});
                        endGame();
                        return;
                    }
                }
                spawnTarget();
            } else {
                score = Math.max(0, score - cfg.missPenalty);
                ctx.strokeStyle = "rgba(255, 56, 56, 0.5)"; ctx.lineWidth = 8; ctx.strokeRect(0, 0, canvas.width, canvas.height);
            }

            if(isMultiplayer) {
                sendNetData("CLICK", { mx: mouseX, my: mouseY });
                syncToOpponent();
            }
            document.getElementById("lblLevel").innerText = level;
            document.getElementById("lblScore").innerText = score;
        });

        function syncToOpponent() {
            sendNetData("UPDATE", { score: score, level: level, target3D: target3D });
        }

        function endGame() {
            if(!isPlaying) return;
            isPlaying = false;
            clearTimeout(targetTimeout); clearInterval(timerInterval);

            document.getElementById("btnStart").disabled = false;
            document.getElementById("selectDifficulty").disabled = false;

            let resultTitle = "🎯 戰術特訓結束";
            let resultDesc = `【我的最終分數】: ${score} 分 (Level ${level})\n`;
            
            if(isMultiplayer) {
                resultTitle = (score > oppScore) ? "👑 贏得線上對決勝利！" : (score < oppScore ? "❌ 線上對決落敗..." : "🤝 雙方平手！");
                resultDesc += `【對手的分數】: ${oppScore} 分\n\n`;
                resultDesc += (score > oppScore) ? "槍法精準！你成功壓制了對手！" : "對手的手速更快，再接再厲！";
            }

            document.getElementById("modal-title").innerText = resultTitle;
            document.getElementById("modal-desc").innerText = resultDesc;
            document.getElementById("modal-overlay").style.display = "flex";
        }

        function closeModal() { document.getElementById("modal-overlay").style.display = "none"; }

        // -------------------------------------------------------------
        // 🎨 3D 繪圖渲染引擎
        // -------------------------------------------------------------
        function drawSceneGrid(cCtx, w, h) {
            cCtx.fillStyle = "#020205"; cCtx.fillRect(0, 0, w, h);
            const farPos = project(0, 0, 1000); const farSize = 160 * farPos.scale;
            cCtx.fillStyle = "#000002"; cCtx.fillRect(vpX - farSize, vpY - farSize, farSize * 2, farSize * 2);
            cCtx.strokeStyle = "rgba(0, 255, 204, 0.1)"; cCtx.strokeRect(vpX - farSize, vpY - farSize, farSize * 2, farSize * 2);
        }

        function drawTargetEntity(cCtx, t3d, colorMain) {
            const proj = project(t3d.x, t3d.y, t3d.z); const r = t3d.baseRadius * proj.scale;
            cCtx.beginPath(); cCtx.moveTo(proj.x, proj.y); cCtx.lineTo(proj.x, vpY + 160 * proj.scale);
            cCtx.strokeStyle = "rgba(40, 50, 70, 0.5)"; cCtx.lineWidth = Math.max(1, 3 * proj.scale); cCtx.stroke();
            cCtx.beginPath(); cCtx.arc(proj.x, proj.y, r, 0, Math.PI * 2); cCtx.fillStyle = colorMain; cCtx.fill();
            cCtx.beginPath(); cCtx.arc(proj.x, proj.y, r * 0.6, 0, Math.PI * 2); cCtx.fillStyle = "#0a0a10"; cCtx.fill();
            cCtx.beginPath(); cCtx.arc(proj.x, proj.y, r * 0.25, 0, Math.PI * 2); cCtx.fillStyle = "#ff3838"; cCtx.fill();
        }

        function drawCanvas() {
            drawSceneGrid(ctx, canvas.width, canvas.height);
            if (isPlaying) drawTargetEntity(ctx, target3D, "#00ffcc");
        }

        function drawGhostCanvas() {
            drawSceneGrid(gCtx, ghostCanvas.width, ghostCanvas.height);
            if (isPlaying && isMultiplayer) {
                drawTargetEntity(gCtx, oppTarget3D, "#ffaa00");
                if (oppLaserTimer > 0) {
                    gCtx.beginPath(); gCtx.moveTo(vpX, ghostCanvas.height); gCtx.lineTo(oppMouse.x, oppMouse.y);
                    gCtx.strokeStyle = `rgba(255, 153, 0, ${oppLaserTimer / 6})`; gCtx.lineWidth = 2; gCtx.stroke();
                    oppLaserTimer--;
                }
                gCtx.strokeStyle = "rgba(255, 153, 0, 0.7)"; gCtx.lineWidth = 1; gCtx.beginPath();
                gCtx.arc(oppMouse.x, oppMouse.y, 5, 0, Math.PI * 2); gCtx.stroke();
            }
        }

        setInterval(() => { if(!isPlaying) { drawCanvas(); drawGhostCanvas(); } }, 30);
    </script>
</body>
</html>

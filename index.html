<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰術模擬：動態難度與影子 PK 3D 靶場</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080810;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
            font-size: 28px;
        }

        #game-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        /* 頂部難度控制面板 */
        #control-panel {
            background-color: #13131c;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #222533;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .panel-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-label {
            font-size: 14px;
            color: #8a8a9e;
            font-weight: bold;
        }

        select {
            background-color: #09090f;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* 遊戲核心容器 */
        #game-container {
            display: flex;
            gap: 20px;
            background-color: #13131c;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #222533;
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 240px;
        }

        .status-box {
            background-color: #09090f;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 15px;
            border-left: 4px solid #00ffcc;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .status-box span {
            font-weight: bold;
            color: #f1c40f;
            font-family: 'Courier New', Courier, monospace;
        }

        .time-warning {
            color: #ff3838 !important;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 50% { opacity: 0.4; } }

        canvas {
            background-color: #020205;
            border: 3px solid #1f2230;
            border-radius: 12px;
            cursor: crosshair;
        }

        #leaderboard {
            background-color: #09090f;
            padding: 12px;
            border-radius: 8px;
            flex-grow: 1;
            margin-bottom: 12px;
            border: 1px solid #1f2230;
            max-height: 180px;
            overflow-y: auto;
        }

        #leaderboard h3 {
            margin-top: 0;
            color: #00ffcc;
            border-bottom: 2px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 5px;
            font-size: 15px;
        }

        ol { padding-left: 20px; margin: 5px 0 0 0; }
        li { margin-bottom: 6px; font-size: 13px; color: #a2a2c2; }

        /* 開關切換鈕 */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #09090f;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #222533;
        }
        .switch-container input { cursor: pointer; width: 16px; height: 16px; }

        .btn {
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            color: #05050a;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5); }
        .btn:disabled { background: #333 !important; color: #666 !important; transform: none !important; box-shadow: none !important; }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 8, 0.9); justify-content: center; align-items: center; z-index: 10;
        }
        #modal { background: #13131c; padding: 35px; border-radius: 16px; text-align: center; border: 2px solid #00ffcc; }
        #modal input { padding: 12px; width: 80%; margin: 18px 0; border: 1px solid #222533; background: #09090f; color: #fff; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>

    <h1>TACTICAL SIMULATOR：3D 影子競速靶場 🎯</h1>
    
    <div id="game-layout">
        <div id="control-panel">
            <div class="panel-section">
                <div class="panel-label">模擬難度：</div>
                <select id="selectDifficulty" onchange="changeDifficulty()">
                    <option value="children">兒童模式 (極易)</option>
                    <option value="easy">簡單模式</option>
                    <option value="normal" selected>普通規格</option>
                    <option value="hard">高度困難</option>
                    <option value="hell">地獄限制</option>
                    <option value="asia">亞洲難度 (Meme Extreme)</option>
                </select>
            </div>

            <div class="panel-section">
                <div class="switch-container">
                    <input type="checkbox" id="chkGhostMode" checked>
                    <label for="chkGhostMode" style="font-size:13px; font-weight:bold; color:#ff3838; cursor:pointer;">開啟頂尖玩家影子 PK</label>
                </div>
            </div>
        </div>

        <div id="game-container">
            <canvas id="aimCanvas" width="600" height="600"></canvas>

            <div id="info-panel">
                <div>
                    <div class="status-box">目前關卡: <span id="lblLevel">1</span> / 5</div>
                    <div class="status-box">當前分數: <span id="lblScore">0</span></div>
                    <div class="status-box">擊中目標: <span id="lblTarget">0 / 10</span></div>
                    <div class="status-box">精準度: <span id="lblAccuracy">100</span>%</div>
                    <div class="status-box">剩餘時間: <span id="lblTime">120.00</span> 秒</div>
                </div>

                <div id="leaderboard">
                    <h3>🏆 本地神射手榜 (<span id="lblBoardDiff">普通</span>)</h3>
                    <ol id="leaderList"><li>暫無資料</li></ol>
                </div>
                
                <button class="btn" id="btnStart" onclick="startGame()">開啟 3D 戰術模擬</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title" style="color:#00ffcc;">訓練結束</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6; color: #ced4da;"></p>
            <div id="name-input-area" style="display:none;">
                <input type="text" id="playerName" placeholder="請輸入你的代號" maxlength="8">
            </div>
            <button class="btn" id="modalBtn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas");
        const ctx = canvas.getContext("2d");

        // 核心計分與狀態變數
        let score = 0, level = 1, hitsInLevel = 0;
        let totalClicks = 0, successfulHits = 0;
        let gameStartTime = 0, timeLeft = 120;
        let isPlaying = false;
        let targetTimeout, timerInterval;

        // 3D 投影設定
        const vpX = 300, vpY = 300, fov = 300;
        let target3D = { x: 0, y: 50, z: 500, baseRadius: 40 };

        // 大廳動畫變數
        let lobbyAnimationId, scanZ = 200, scanDirection = 1, particles = [];
        for(let i=0; i<25; i++) {
            particles.push({ x: Math.random()*500-250, y: Math.random()*500-250, z: Math.random()*800+200, speed: Math.random()*2+1 });
        }

        // 👥 影子 PK 錄製與播放核心變數
        let currentRunData = []; // 錄製當前玩家：[{time: 毫秒, type: 'spawn'/'click'/'hit', x, y, z, rx, ry, mx, my}]
        let ghostRunData = null;  // 目前榜首的影子紀錄數據
        let ghostIndex = 0;       // 影子數據播放指標
        let ghostMouse = { x: 300, y: 300 }; // 畫面上顯示的影子虛擬滑鼠位置
        let ghostLaserTimer = 0;   // 影子開槍開火雷射光芒計時器

        // 🎛 六大難度配置參數矩陣 (控制：總時間 / 每關需求數 / 靶基底半徑 / 反應時間速度遞進)
        const difficultySettings = {
            children: { name: "兒童", gameTime: 180, reqHits: [5, 5, 5, 5, 5],    radius: [65, 60, 55, 50, 45], duration: [3000, 2800, 2600, 2400, 2200], missPenalty: 0 },
            easy:     { name: "簡單", gameTime: 150, reqHits: [8, 8, 10, 10, 10],  radius: [50, 46, 42, 38, 35], duration: [2000, 1800, 1600, 1400, 1200], missPenalty: 2 },
            normal:   { name: "普通", gameTime: 120, reqHits: [10, 10, 12, 12, 15], radius: [42, 38, 34, 30, 26], duration: [1500, 1300, 1100, 950,  800],  missPenalty: 5 },
            hard:     { name: "困難", gameTime: 90,  reqHits: [12, 12, 15, 15, 20], radius: [34, 30, 26, 23, 20], duration: [1100, 950,  800,  650,  550],  missPenalty: 10 },
            hell:     { name: "地獄", gameTime: 60,  reqHits: [15, 15, 18, 20, 25], radius: [25, 22, 19, 16, 14], duration: [750,  650,  550,  480,  400],  missPenalty: 20 },
            asia:     { name: "亞洲", gameTime: 45,  reqHits: [15, 18, 20, 22, 30], radius: [18, 15, 12, 10, 8],  duration: [500,  430,  370,  310,  250],  missPenalty: 40 }
        };

        function getDiff() { return document.getElementById("selectDifficulty").value; }

        function changeDifficulty() {
            if (isPlaying) return;
            const diff = getDiff();
            document.getElementById("lblBoardDiff").innerText = difficultySettings[diff].name;
            showLeaderboard();
        }

        function resetGame() {
            const cfg = difficultySettings[getDiff()];
            score = 0; level = 1; hitsInLevel = 0; totalClicks = 0; successfulHits = 0;
            timeLeft = cfg.gameTime;
            currentRunData = []; // 清空錄製
            document.getElementById("lblTime").classList.remove("time-warning");
            updateUI();
        }

        function startGame() {
            if (isPlaying) return;
            cancelAnimationFrame(lobbyAnimationId);
            resetGame();
            isPlaying = true;

            document.getElementById("btnStart").disabled = true;
            document.getElementById("selectDifficulty").disabled = true;

            // 讀取該難度榜首的影子紀錄
            const board = getLeaderboard();
            ghostRunData = (board.length > 0 && board[0].runData) ? board[0].runData : null;
            ghostIndex = 0;
            ghostLaserTimer = 0;

            gameStartTime = performance.now();
            recordEvent('start', {});

            const maxDuration = difficultySettings[getDiff()].gameTime;
            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - gameStartTime) / 1000;
                timeLeft = (maxDuration - elapsed).toFixed(2);
                if (timeLeft <= 15) document.getElementById("lblTime").classList.add("time-warning");
                if (timeLeft <= 0) {
                    timeLeft = "0.00";
                    endGame(false, true);
                    return;
                }
                document.getElementById("lblTime").innerText = timeLeft;
                
                // 👥 影子回放時鐘同步邏輯
                if (ghostRunData && document.getElementById("chkGhostMode").checked) {
                    const currentMillis = performance.now() - gameStartTime;
                    while (ghostIndex < ghostRunData.length && ghostRunData[ghostIndex].time <= currentMillis) {
                        const gEvent = ghostRunData[ghostIndex];
                        if (gEvent.type === 'click' || gEvent.type === 'hit') {
                            ghostMouse.x = gEvent.mx;
                            ghostMouse.y = gEvent.my;
                            ghostLaserTimer = 8; // 觸發虛擬軌跡紅線開火特效
                        } else if (gEvent.type === 'spawn') {
                            // 影子移動滑鼠瞄準新靶子
                            ghostMouse.x = gEvent.projX;
                            ghostMouse.y = gEvent.projY;
                        }
                        ghostIndex++;
                    }
                }
            }, 10);

            spawnTarget();
        }

        function recordEvent(type, extra) {
            if (!isPlaying) return;
            currentRunData.push({
                time: performance.now() - gameStartTime,
                type: type,
                ...extra
            });
        }

        function spawnTarget() {
            if (!isPlaying) return;
            clearTimeout(targetTimeout);

            const cfg = difficultySettings[getDiff()];
            target3D.z = Math.random() * (900 - 220) + 220;
            target3D.baseRadius = cfg.radius[level - 1];

            // 限制世界座標範圍
            const maxW = 210;
            target3D.x = Math.random() * (maxW * 2) - maxW;
            target3D.y = Math.random() * (180 - (-50)) + (-50);

            const proj = project(target3D.x, target3D.y, target3D.z);
            recordEvent('spawn', { x: target3D.x, y: target3D.y, z: target3D.z, projX: proj.x, projY: proj.y });

            drawCanvas();

            targetTimeout = setTimeout(() => {
                spawnTarget();
            }, cfg.duration[level - 1]);
        }

        function project(x, y, z) {
            const scale = fov / z;
            return { x: vpX + x * scale, y: vpY + y * scale, scale: scale };
        }

        function updateLobby() {
            if (isPlaying) return;
            scanZ += scanDirection * 4;
            if (scanZ > 950 || scanZ < 200) scanDirection *= -1;

            particles.forEach(p => {
                p.z -= p.speed;
                if (p.z < 150) {
                    p.z = 1000; p.x = Math.random()*500-250; p.y = Math.random()*500-250;
                }
            });
            drawCanvas();
            lobbyAnimationId = requestAnimationFrame(updateLobby);
        }

        function drawCanvas() {
            ctx.fillStyle = "#020206";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const size = 250; 

            // 1. 遠方終點
            const farPos = project(0, 0, 1000);
            const farSize = size * farPos.scale;
            ctx.fillStyle = "#000003";
            ctx.fillRect(vpX - farSize, vpY - farSize, farSize * 2, farSize * 2);
            ctx.strokeStyle = "rgba(0, 255, 204, 0.15)";
            ctx.strokeRect(vpX - farSize, vpY - farSize, farSize * 2, farSize * 2);

            // 2. 3D 隧道網格
            const zStrips = [1000, 750, 560, 420, 310, 230, 170];
            for (let i = 0; i < zStrips.length - 1; i++) {
                const zFar = zStrips[i], zNear = zStrips[i + 1];
                const pFar = project(0, 0, zFar), pNear = project(0, 0, zNear);
                const sFar = size * pFar.scale, sNear = size * pNear.scale;

                const alpha = (1 - (zNear / 1000)) * 0.35;
                ctx.strokeStyle = `rgba(0, 255, 204, ${alpha})`;
                ctx.lineWidth = (1 - (zNear / 1000)) * 2;
                ctx.strokeRect(vpX - sNear, vpY - sNear, sNear * 2, sNear * 2);

                ctx.beginPath();
                ctx.moveTo(vpX - sNear, vpY - sNear); ctx.lineTo(vpX - sFar, vpY - sFar);
                ctx.moveTo(vpX + sNear, vpY - sNear); ctx.lineTo(vpX + sFar, vpY - sFar);
                ctx.moveTo(vpX - sNear, vpY + sNear); ctx.lineTo(vpX - sFar, vpY + sFar);
                ctx.moveTo(vpX + sNear, vpY + sNear); ctx.lineTo(vpX + sFar, vpY + sFar);
                ctx.moveTo(vpX - sNear * 0.5, vpY + sNear); ctx.lineTo(vpX - sFar * 0.5, vpY + sFar);
                ctx.moveTo(vpX + sNear * 0.5, vpY + sNear); ctx.lineTo(vpX + sFar * 0.5, vpY + sFar);
                ctx.stroke();
            }

            // 大廳環境特效
            if (!isPlaying) {
                particles.forEach(p => {
                    const pt = project(p.x, p.y, p.z);
                    if (pt.x > 0 && pt.x < 600 && pt.y > 0 && pt.y < 600) {
                        ctx.fillStyle = `rgba(0, 255, 204, ${Math.max(0, (1 - p.z / 1000) * 0.6)})`;
                        ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(0.5, 2.5 * pt.scale), 0, Math.PI * 2); ctx.fill();
                    }
                });
                const scanPos = project(0, 0, scanZ), scanSize = size * scanPos.scale;
                ctx.strokeStyle = `rgba(0, 180, 255, ${Math.max(0, (1 - scanZ / 1000) * 0.25)})`;
                ctx.strokeRect(vpX - scanSize, vpY - scanSize, scanSize * 2, scanSize * 2);
            }

            // 3. 繪製 3D 實體靶架與投影
            const targetProj = project(target3D.x, target3D.y, target3D.z);
            const r = target3D.baseRadius * targetProj.scale;
            const floorY = vpY + size * targetProj.scale;

            ctx.beginPath();
            ctx.moveTo(targetProj.x, targetProj.y); ctx.lineTo(targetProj.x, floorY);
            ctx.strokeStyle = "rgba(40, 50, 70, 0.9)";
            ctx.lineWidth = Math.max(2, 6 * targetProj.scale);
            ctx.stroke();

            ctx.fillStyle = "#151922";
            ctx.fillRect(targetProj.x - r*0.3, floorY - r*0.1, r*0.6, r*0.2);

            ctx.beginPath();
            ctx.ellipse(targetProj.x, floorY, r, r * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${Math.max(0, (1 - target3D.z / 1000) * 0.5)})`;
            ctx.fill();

            // 靶面 3D 斜切壓扁
            let radiusX = r, radiusY = r;
            const xRatio = target3D.x / size, yRatio = target3D.y / size;
            if (Math.abs(xRatio) > 0.35 && Math.abs(xRatio) > Math.abs(yRatio)) radiusX = r * (1 - Math.abs(xRatio) * 0.35);
            else if (yRatio < -0.35) radiusY = r * (1 - Math.abs(yRatio) * 0.35);

            // 繪製電子霓虹靶
            ctx.shadowBlur = Math.max(5, 25 * targetProj.scale); ctx.shadowColor = "#00ffcc";
            ctx.beginPath(); ctx.ellipse(targetProj.x, targetProj.y, radiusX, radiusY, 0, 0, Math.PI * 2); ctx.fillStyle = "#00ffcc"; ctx.fill();
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.ellipse(targetProj.x, targetProj.y, radiusX * 0.65, radiusY * 0.65, 0, 0, Math.PI * 2); ctx.fillStyle = "#111116"; ctx.fill();
            ctx.beginPath(); ctx.ellipse(targetProj.x, targetProj.y, radiusX * 0.28, radiusY * 0.28, 0, 0, Math.PI * 2); ctx.fillStyle = "#ff3838"; ctx.fill();

            // 👥 4. 影子玩家 (Ghost Player) 渲染繪製
            if (isPlaying && ghostRunData && document.getElementById("chkGhostMode").checked) {
                // 繪製半透明虛擬槍線（如果影子正在開火）
                if (ghostLaserTimer > 0) {
                    ctx.beginPath();
                    ctx.moveTo(300, 600); // 從螢幕底部發射
                    ctx.lineTo(ghostMouse.x, ghostMouse.y);
                    ctx.strokeStyle = `rgba(255, 56, 56, ${ghostLaserTimer / 8 * 0.4})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ghostLaserTimer--;
                }
                // 繪製影子準星
                ctx.strokeStyle = "rgba(255, 56, 56, 0.6)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(ghostMouse.x, ghostMouse.y, 8, 0, Math.PI * 2);
                ctx.moveTo(ghostMouse.x - 14, ghostMouse.y); ctx.lineTo(ghostMouse.x + 14, ghostMouse.y);
                ctx.moveTo(ghostMouse.x, ghostMouse.y - 14); ctx.lineTo(ghostMouse.x, ghostMouse.y + 14);
                ctx.stroke();
                ctx.fillStyle = "rgba(255, 56, 56, 0.7)";
                ctx.font = "10px monospace";
                ctx.fillText("榜首影子", ghostMouse.x + 18, ghostMouse.y + 4);
            }

            // 大廳文字 UI
            if (!isPlaying) {
                ctx.strokeStyle = "rgba(0, 255, 204, 0.4)"; ctx.lineWidth = 2; const len = 25, pad = 15;
                ctx.beginPath(); ctx.moveTo(pad, pad+len); ctx.lineTo(pad, pad); ctx.lineTo(pad+len, pad); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(600-pad, pad+len); ctx.lineTo(600-pad, pad); ctx.lineTo(600-pad-len, pad); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(pad, 600-pad-len); ctx.lineTo(pad, 600-pad); ctx.lineTo(pad+len, 600-pad); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(600-pad, 600-pad-len); ctx.lineTo(600-pad, 600-pad); ctx.lineTo(600-pad-len, 600-pad); ctx.stroke();

                const pulse = Math.abs(Math.sin(performance.now() / 300));
                ctx.fillStyle = `rgba(0, 255, 204, ${0.4 + pulse * 0.6})`; ctx.font = "bold 15px 'Segoe UI', monospace"; ctx.textAlign = "center";
                ctx.fillText(`[ SYSTEM READY : LOBBY WAITING ]`, 300, 45);
                ctx.fillStyle = "rgba(162, 162, 194, 0.7)"; ctx.font = "13px 'Segoe UI'";
                ctx.fillText("調整上方難度，並點擊「開啟 3D 戰術模擬」解鎖靶場", 300, 560);
            }
        }

        // 開槍判定
        canvas.addEventListener("mousedown", (e) => {
            if (!isPlaying) return;
            totalClicks++;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const targetProj = project(target3D.x, target3D.y, target3D.z);
            const r = target3D.baseRadius * targetProj.scale;

            let rx = r, ry = r;
            const xRatio = target3D.x / 250, yRatio = target3D.y / 250;
            if (Math.abs(xRatio) > 0.35 && Math.abs(xRatio) > Math.abs(yRatio)) rx = r * (1 - Math.abs(xRatio) * 0.35);
            else if (yRatio < -0.35) ry = r * (1 - Math.abs(yRatio) * 0.35);

            const clickDist = ((mouseX - targetProj.x) ** 2) / (rx ** 2) + ((mouseY - targetProj.y) ** 2) / (ry ** 2);
            const cfg = difficultySettings[getDiff()];

            if (clickDist <= 1.0) {
                successfulHits++; hitsInLevel++;
                
                let distanceBonus = Math.round((target3D.z - 200) / 15);
                let basePoints = level * 10;
                if (getDiff() === 'asia') basePoints *= 3; // 亞洲模式分數翻倍
                if (getDiff() === 'hell') basePoints *= 2;

                score += basePoints + Math.max(0, distanceBonus); 
                recordEvent('hit', { mx: mouseX, my: mouseY });

                const req = cfg.reqHits[level - 1];
                if (hitsInLevel >= req) {
                    if (level < 5) nextLevel();
                    else endGame(true, false);
                } else {
                    spawnTarget(); 
                }
            } else {
                score = Math.max(0, score - cfg.missPenalty);
                recordEvent('click', { mx: mouseX, my: mouseY });
                drawFlashBorder(); 
            }
            updateUI();
        });

        function nextLevel() {
            level++; hitsInLevel = 0; updateUI();
            ctx.fillStyle = "rgba(0, 255, 204, 0.35)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            isPlaying = false;
            setTimeout(() => {
                if(totalClicks > 0 && timeLeft > 0) { isPlaying = true; spawnTarget(); }
            }, 300);
        }

        function drawFlashBorder() {
            ctx.strokeStyle = "rgba(255, 56, 56, 0.5)"; ctx.lineWidth = 10; ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        function updateUI() {
            const cfg = difficultySettings[getDiff()];
            const req = cfg ? cfg.reqHits[level - 1] : 0;
            document.getElementById("lblLevel").innerText = level;
            document.getElementById("lblScore").innerText = score;
            document.getElementById("lblTarget").innerText = `${hitsInLevel} / ${req}`;
            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            document.getElementById("lblAccuracy").innerText = accuracy;
        }

        function endGame(isWin, isTimeOut = false) {
            isPlaying = false;
            clearTimeout(targetTimeout); clearInterval(timerInterval);
            recordEvent('end', {});

            document.getElementById("btnStart").disabled = false;
            document.getElementById("selectDifficulty").disabled = false;

            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            let title = isWin ? "⚡ 特訓通關！" : "⏰ 限制時間截止！";
            if (isWin && getDiff() === 'asia') title = "🥢 💥 恭喜你獲得亞洲神射手認證！";

            const maxDuration = difficultySettings[getDiff()].gameTime;
            const timeUsed = (maxDuration - parseFloat(timeLeft)).toFixed(2);
            let desc = `最終得分：${score} 分\n通關進度：第 ${level} 關\n總計耗時：${timeUsed} 秒\n射擊精準度：${accuracy}%`;
            
            document.getElementById("modal-title").innerText = title;
            if (checkHighScore(score)) {
                desc += "\n\n恭喜打破歷史紀錄！你的開槍軌跡將被錄製為影子！請輸入代號：";
                document.getElementById("name-input-area").style.display = "block";
            } else {
                desc += "\n\n未能打破目前第一名的影子紀錄，請繼續加油！";
                document.getElementById("name-input-area").style.display = "none";
            }
            
            document.getElementById("modal-desc").innerText = desc;
            document.getElementById("modal-overlay").style.display = "flex";
            
            target3D = { x: 0, y: 50, z: 500, baseRadius: 40 };
            updateLobby(); 
        }

        function closeModal() {
            const nameInput = document.getElementById("playerName");
            if (document.getElementById("name-input-area").style.display === "block") {
                const name = nameInput.value.trim() || "Ranger";
                saveHighScore(name, score, currentRunData); // 把當前錄製的軌跡存入榜首
                nameInput.value = "";
            }
            document.getElementById("modal-overlay").style.display = "none";
            showLeaderboard();
        }

        function getLeaderboard() {
            const diff = getDiff();
            const board = localStorage.getItem(`aim_leaderboard_v6_${diff}`);
            return board ? JSON.parse(board) : [];
        }

        function checkHighScore(currentScore) {
            if (currentScore === 0) return false;
            const board = getLeaderboard();
            if (board.length < 5) return true;
            return currentScore > board[board.length - 1].score;
        }

        function saveHighScore(name, currentScore, runData) {
            const diff = getDiff();
            let board = getLeaderboard();
            
            // 只有第一名能保存影子軌跡 runData 以節省儲存空間，其他人設為 null
            const isNewNumberOne = board.length === 0 || currentScore > board[0].score;
            
            board.push({
                name: name,
                score: currentScore,
                date: new Date().toLocaleDateString(),
                runData: isNewNumberOne ? runData : null 
            });
            
            board.sort((a, b) => b.score - a.score);
            
            // 重新整理榜首：確保排序後的絕對第一名保留影子
            for (let i = 0; i < board.length; i++) {
                if (i > 0) board[i].runData = null; 
            }
            
            board = board.slice(0, 5);
            localStorage.setItem(`aim_leaderboard_v6_${diff}`, JSON.stringify(board));
        }

        function showLeaderboard() {
            const board = getLeaderboard();
            const listEl = document.getElementById("leaderList");
            listEl.innerHTML = "";
            if (board.length === 0) {
                listEl.innerHTML = "<li>暫無資料</li>";
                return;
            }
            board.forEach((item, index) => {
                const li = document.createElement("li");
                const hasGhost = (index === 0 && item.runData) ? " 👻(自帶影子)" : "";
                li.innerHTML = `<strong>${item.name}</strong> - ${item.score} 點 (${item.date})${hasGhost}`;
                listEl.appendChild(li);
            });
        }

        updateLobby();
        showLeaderboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限射擊：五關打靶練槍器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none; /* 防止頻繁點擊時選取到文字 */
        }

        h1 {
            margin-bottom: 10px;
            color: #e74c3c;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        #game-container {
            display: flex;
            gap: 20px;
            background-color: #2c2c35;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 220px;
        }

        .status-box {
            background-color: #121216;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 5px solid #e74c3c;
        }

        .status-box span {
            font-weight: bold;
            color: #f1c40f;
            font-family: monospace;
        }

        /* 遊戲畫布：準心樣式 */
        canvas {
            background-color: #111116;
            border: 3px solid #444;
            border-radius: 6px;
            cursor: crosshair; /* 滑鼠游標變成十字準心 */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #leaderboard {
            background-color: #121216;
            padding: 15px;
            border-radius: 6px;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        #leaderboard h3 {
            margin-top: 0;
            color: #3498db;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        ol {
            padding-left: 20px;
            margin: 10px 0 0 0;
        }

        li {
            margin-bottom: 6px;
            font-size: 14px;
        }

        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #c0392b;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        /* 彈出視窗 */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #modal {
            background: #2c2c35;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 80%;
            border: 1px solid #e74c3c;
        }

        #modal input {
            padding: 10px;
            width: 80%;
            margin: 15px 0;
            border: 1px solid #444;
            background: #121216;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>AIM TRAINER：極限打靶 🎯</h1>
    
    <div id="game-container">
        <canvas id="aimCanvas" width="500" height="500"></canvas>

        <div id="info-panel">
            <div>
                <div class="status-box">目前關卡: <span id="lblLevel">1</span> / 5</div>
                <div class="status-box">當前分數: <span id="lblScore">0</span></div>
                <div class="status-box">擊中目標: <span id="lblTarget">0 / 10</span></div>
                <div class="status-box">精準度: <span id="lblAccuracy">100</span>%</div>
                <div class="status-box">時間: <span id="lblTime">0.00</span> 秒</div>
            </div>

            <div id="leaderboard">
                <h3>🏆 前五名神射手</h3>
                <ol id="leaderList">
                    <li>暫無資料</li>
                </ol>
            </div>
            
            <button class="btn" id="btnStart" onclick="startGame()">開始訓練</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">訓練結束</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6;"></p>
            <div id="name-input-area" style="display:none;">
                <input type="text" id="playerName" placeholder="請輸入你的代號 (最多8字)" maxlength="8">
            </div>
            <button class="btn" id="modalBtn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲核心變數
        let score = 0;
        let level = 1;
        let hitsInLevel = 0;
        let totalClicks = 0;
        let successfulHits = 0;
        let startTime = 0;
        let timeElapsed = 0;
        
        let isPlaying = false;
        let targetTimeout;
        let timerInterval;

        // 當前靶的資訊
        let target = { x: 0, y: 0, radius: 0 };

        // 關卡設定：[關卡] = { 目標擊中數, 靶半徑, 靶停留時間(ms) }
        const levelSettings = {
            1: { requiredHits: 10, radius: 25, duration: 1500 },
            2: { requiredHits: 12, radius: 20, duration: 1200 },
            3: { requiredHits: 15, radius: 15, duration: 950 },
            4: { requiredHits: 18, radius: 11, duration: 750 },
            5: { requiredHits: 20, radius: 7,  duration: 550 } // 地獄級
        };

        // 初始化/重置遊戲
        function resetGame() {
            score = 0;
            level = 1;
            hitsInLevel = 0;
            totalClicks = 0;
            successfulHits = 0;
            timeElapsed = 0;
            updateUI();
        }

        // 開始遊戲
        function startGame() {
            if (isPlaying) return;
            resetGame();
            isPlaying = true;
            
            // 停用按鈕
            document.getElementById("btnStart").disabled = true;
            document.getElementById("btnStart").style.backgroundColor = "#7f8c8d";
            
            startTime = performance.now();
            
            // 啟動精準計時器 (每10毫秒更新一次小數點)
            timerInterval = setInterval(() => {
                timeElapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                document.getElementById("lblTime").innerText = timeElapsed;
            }, 10);

            spawnTarget();
        }

        // 生成靶
        function spawnTarget() {
            if (!isPlaying) return;
            clearTimeout(targetTimeout);

            const settings = levelSettings[level];
            
            // 隨機生成坐標，確保靶不會切到畫布邊緣
            const margin = settings.radius + 10;
            target.x = Math.random() * (canvas.width - margin * 2) + margin;
            target.y = Math.random() * (canvas.height - margin * 2) + margin;
            target.radius = settings.radius;

            drawCanvas();

            // 若時間內沒點到，自動刷新到下一個位置
            targetTimeout = setTimeout(() => {
                spawnTarget();
            }, settings.duration);
        }

        // 繪製畫布與靶心
        function drawCanvas() {
            // 清空畫布
            ctx.fillStyle = "#111116";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫網格背景（增加科技/訓練場感）
            ctx.strokeStyle = "#22222b";
            ctx.lineWidth = 1;
            for(let i = 50; i < canvas.width; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            if (!isPlaying) return;

            // 繪製同心圓靶心 (紅底白圈)
            const r = target.radius;
            
            // 外圈
            ctx.beginPath();
            ctx.arc(target.x, target.y, r, 0, Math.PI * 2);
            ctx.fillStyle = "#e74c3c";
            ctx.fill();

            // 中圈
            ctx.beginPath();
            ctx.arc(target.x, target.y, r * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            // 內圈中心點
            ctx.beginPath();
            ctx.arc(target.x, target.y, r * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = "#e74c3c";
            ctx.fill();
        }

        // 監聽畫布點擊 (開槍)
        canvas.addEventListener("mousedown", (e) => {
            if (!isPlaying) return;

            totalClicks++;

            // 獲取滑鼠在畫布上的精確相對坐標
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // 計算滑鼠點擊點與靶心的距離 (勾股定理)
            const distance = Math.sqrt((mouseX - target.x) ** 2 + (mouseY - target.y) ** 2);

            if (distance <= target.radius) {
                // 🎯 擊中靶
                successfulHits++;
                hitsInLevel++;
                
                // 關卡加分：關卡越高，單發分數越高
                score += level * 10; 

                // 檢查是否達到該關卡過關目標
                const req = levelSettings[level].requiredHits;
                if (hitsInLevel >= req) {
                    if (level < 5) {
                        nextLevel();
                    } else {
                        endGame(true); // 五關全過，破台！
                    }
                } else {
                    spawnTarget(); // 繼續下一個靶
                }
            } else {
                // ❌ 脫靶 (倒扣分數，最低扣到0分)
                score = Math.max(0, score - 5);
                drawFlashBorder(); // 脫靶閃爍紅邊提示
            }

            updateUI();
        });

        // 升關邏輯
        function nextLevel() {
            level++;
            hitsInLevel = 0;
            updateUI();

            // 過關時畫布綠色閃爍特效
            ctx.fillStyle = "rgba(46, 204, 113, 0.4)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 稍微停頓 200ms 後再出新靶，給玩家反應時間
            isPlaying = false;
            setTimeout(() => {
                if(totalClicks > 0) { // 確保沒被手動重置
                    isPlaying = true;
                    spawnTarget();
                }
            }, 300);
        }

        // 脫靶時的畫布閃動提示
        function drawFlashBorder() {
            ctx.strokeStyle = "rgba(231, 76, 60, 0.5)";
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        // 更新介面文字
        function updateUI() {
            const req = levelSettings[level] ? levelSettings[level].requiredHits : 0;
            document.getElementById("lblLevel").innerText = level;
            document.getElementById("lblScore").innerText = score;
            document.getElementById("lblTarget").innerText = `${hitsInLevel} / ${req}`;
            
            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            document.getElementById("lblAccuracy").innerText = accuracy;
        }

        // 結束遊戲
        function endGame(isWin) {
            isPlaying = false;
            clearTimeout(targetTimeout);
            clearInterval(timerInterval);
            
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStart").style.backgroundColor = "#e74c3c";

            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            const title = isWin ? "⚡ 恭喜完成全五關特訓！" : "訓練結束";
            
            let desc = `最終得分：${score} 分\n總耗時：${timeElapsed} 秒\n整體精準度：${accuracy}%`;
            
            document.getElementById("modal-title").innerText = title;
            
            if (checkHighScore(score)) {
                desc += "\n\n恭喜你擠進神射手排行榜！請輸入名字：";
                document.getElementById("name-input-area").style.display = "block";
            } else {
                document.getElementById("name-input-area").style.display = "none";
            }
            
            document.getElementById("modal-desc").innerText = desc;
            document.getElementById("modal-overlay").style.display = "flex";
            
            drawCanvas(); // 清空畫布上的靶
        }

        function closeModal() {
            const nameInput = document.getElementById("playerName");
            if (document.getElementById("name-input-area").style.display === "block") {
                const name = nameInput.value.trim() || "未知小兵";
                saveHighScore(name, score);
                nameInput.value = "";
            }
            document.getElementById("modal-overlay").style.display = "none";
            showLeaderboard();
        }

        // --- 排行榜 LocalStorage 邏輯 ---
        function getLeaderboard() {
            const board = localStorage.getItem("aim_leaderboard");
            return board ? JSON.parse(board) : [];
        }

        function checkHighScore(currentScore) {
            if (currentScore === 0) return false;
            const board = getLeaderboard();
            if (board.length < 5) return true;
            return currentScore > board[board.length - 1].score;
        }

        function saveHighScore(name, currentScore) {
            let board = getLeaderboard();
            board.push({name: name, score: currentScore, date: new Date().toLocaleDateString()});
            board.sort((a, b) => b.score - a.score);
            board = board.slice(0, 5);
            localStorage.setItem("aim_leaderboard", JSON.stringify(board));
        }

        function showLeaderboard() {
            const board = getLeaderboard();
            const listEl = document.getElementById("leaderList");
            listEl.innerHTML = "";
            
            if (board.length === 0) {
                listEl.innerHTML = "<li>暫無資料</li>";
                return;
            }

            board.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = `<strong>${item.name}</strong> - ${item.score} 分 (${item.date})`;
                listEl.appendChild(li);
            });
        }

        // 初始繪製背景與載入排行榜
        drawCanvas();
        showLeaderboard();
    </script>
</body>
</html>

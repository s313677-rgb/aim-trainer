<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限射擊：3D線上 P2P 聯賽靶場</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d12;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 5px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
            font-size: 24px;
        }

        #game-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1100px;
            width: 95%;
        }

        /* 頂部 P2P 大廳控制面板 */
        #control-panel {
            background-color: #1a1a24;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .panel-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-label {
            font-size: 14px;
            color: #8a8a9e;
            font-weight: bold;
        }

        .panel-input {
            background-color: #09090d;
            color: #fff;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
            text-align: center;
            width: 110px;
        }
        .panel-input:focus { border-color: #00ffcc; }

        .btn-sm {
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            color: #0d0d12;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sm:hover { opacity: 0.9; }

        /* 核心遊戲區：分割雙視窗 */
        #game-container {
            display: flex;
            gap: 20px;
            background-color: #1a1a24;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        .canvas-wrapper {
            display: flex;
            gap: 12px;
            background: #050508;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        canvas {
            background-color: #050508;
            border: 2px solid #333;
            border-radius: 8px;
        }
        #aimCanvas { border-color: #00ffcc; cursor: crosshair; box-shadow: 0 0 15px rgba(0, 255, 204, 0.1); }
        #ghostCanvas { border-color: #ffaa00; }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 230px;
            flex-shrink: 0;
        }

        .status-box {
            background-color: #09090d;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #00ffcc;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .status-box span { font-weight: bold; color: #f1c40f; font-family: monospace; }
        .net-status { border-left-color: #ffaa00 !important; }

        #leaderboard {
            background-color: #09090d;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #222;
            margin-bottom: 12px;
            max-height: 120px;
            overflow-y: auto;
        }
        #leaderboard h3 { margin: 0 0 5px 0; color: #00ffcc; border-bottom: 1px solid #333; padding-bottom: 5px; font-size: 14px; }
        ol { padding-left: 18px; margin: 5px 0; font-size: 12px; color: #b3b3cc; }

        .btn {
            background-color: #00ffcc;
            color: #0d0d12;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn:hover { background-color: #00ccaa; box-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }
        .btn:disabled { background-color: #444 !important; color: #888 !important; box-shadow: none !important; cursor: not-allowed; }

        /* 彈出結算視窗 */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 10;
        }
        #modal {
            background: #1a1a24; padding: 30px; border-radius: 12px; text-align: center;
            box-width: 400px; width: 80%; border: 2px solid #00ffcc;
        }
        #modal input {
            padding: 10px; width: 80%; margin: 15px 0; border: 1px solid #00ffcc;
            background: #09090d; color: #fff; border-radius: 5px; font-size: 16px; text-align: center;
        }
        .time-warning { color: #ff4757 !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <h1>TACTICAL SIMULATOR：3D P2P 線上對決大廳 🎯</h1>
    
    <div id="game-layout">
        <div id="control-panel">
            <div class="panel-row">
                <div class="panel-section">
                    <span class="panel-label">我的戰術代號：</span>
                    <input type="text" id="playerNameInput" class="panel-input" value="Ranger" maxlength="8" onchange="updateMyName()">
                </div>
                <div class="panel-section">
                    <span class="panel-label">我的專屬房號：</span>
                    <span id="my-peer-id" style="color: #00ffcc; font-weight: bold; font-family: monospace; font-size: 16px;">同步中...</span>
                    <span id="net-msg" style="color: #ffaa00; font-size: 13px; margin-left: 10px;">📡 正在連線大廳...</span>
                </div>
            </div>

            <div class="panel-row" style="border-top: 1px dashed #333; padding-top: 10px;">
                <div class="panel-section">
                    <span class="panel-label" style="color: #ffaa00;">好友連線：</span>
                    <button class="btn-sm" style="background: #ffaa00; color: #fff;" onclick="copyRoomId()">複製我的房號</button>
                    <input type="text" id="joinIdInput" class="panel-input" style="width: 90px;" placeholder="輸入朋友房號" maxlength="5">
                    <button class="btn-sm" onclick="joinRoom()">進房 PK</button>
                </div>
                <div class="panel-section">
                    <span class="panel-label" style="color: #00b3ff;">隨機匹配：</span>
                    <button class="btn-sm" style="background: linear-gradient(135deg, #00b3ff 0%, #8800ff 100%); color:white;" id="btnMatch" onclick="startMatchmaking()">尋找線上對手</button>
                </div>
            </div>
        </div>

        <div id="game-container">
            <div class="canvas-wrapper">
                <canvas id="ghostCanvas" width="380" height="420"></canvas>
                <canvas id="aimCanvas" width="380" height="420"></canvas>
            </div>

            <div id="info-panel">
                <div>
                    <div class="status-box">我的代號: <span id="lblMyName">Ranger</span></div>
                    <div class="status-box net-status">對手代號: <span id="lblOppName">單機練習中</span></div>
                    <div class="status-box net-status">連線狀態: <span id="lblRoomState">LOCAL</span></div>
                    <div class="status-box">目前關卡: <span id="lblLevel">1</span> / 5</div>
                    <div class="status-box">我的分數: <span id="lblScore">0</span></div>
                    <div class="status-box net-status">對手分數: <span id="lblOppScore">0</span></div>
                    <div class="status-box">剩餘時間: <span id="lblTime">120.00</span></div>
                </div>

                <div id="leaderboard">
                    <h3>🏆 本地神射手榜</h3>
                    <ol id="leaderList"><li>暫無資料</li></ol>
                </div>
                
                <button class="btn" id="btnStart" onclick="localPracticeStart()">開啟單機練習</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">訓練結束</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6;"></p>
            <div id="name-input-area" style="display:none;">
                </div>
            <button class="btn" id="modalBtn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas"); const ctx = canvas.getContext("2d");
        const ghostCanvas = document.getElementById("ghostCanvas"); const gCtx = ghostCanvas.getContext("2d");

        // 核心玩法數據
        let score = 0, level = 1, hitsInLevel = 0, totalClicks = 0, successfulHits = 0, timeLeft = 120; 
        let isPlaying = false, targetTimeout, timerInterval, startTime = 0;
        let myName = "Ranger_" + Math.floor(Math.random()*900+100);
        document.getElementById("playerNameInput").value = myName;
        document.getElementById("lblMyName").innerText = myName;

        // 3D 靶心坐標 (映射到 380x420 的視窗)
        let target = { x: 190, y: 200, radius: 25, z: 1.0 };

        const levelSettings = {
            1: { requiredHits: 10, radius: 22, duration: 1500 },
            2: { requiredHits: 12, radius: 19, duration: 1200 },
            3: { requiredHits: 15, radius: 15, duration: 950 },
            4: { requiredHits: 18, radius: 12, duration: 750 },
            5: { requiredHits: 20, radius: 9,  duration: 550 }
        };

        // 🌐 P2P 線上連線變數
        let peer = null, conn = null, myPeerId = "";
        let isMultiplayer = false, oppName = "等待中...", oppScore = 0, oppLevel = 1;
        let oppTarget = { x: 190, y: 200, radius: 25, z: 1.0 };
        let oppLaserTimer = 0, oppMouse = { x: 190, y: 200 };

        // -------------------------------------------------------------
        // 📡 PeerJS 免費點對點連線引擎
        // -------------------------------------------------------------
        myPeerId = Math.floor(10000 + Math.random() * 89999).toString(); // 亂數生成 5 位數短房號
        peer = new Peer(myPeerId);

        peer.on('open', (id) => {
            document.getElementById("my-peer-id").innerText = id;
            document.getElementById("net-msg").innerText = "📡 雲大廳連線成功！";
        });

        // 監聽：當朋友輸入你的代碼進房時
        peer.on('connection', (incomingConn) => {
            if (isPlaying) return; // 遊戲中不允許插隊
            conn = incomingConn;
            setupP2PConnection();
            document.getElementById("lblRoomState").innerText = "好友房(房主)";
            document.getElementById("net-msg").innerText = "⚔️ 朋友已進房！正在同步對決...";
            
            setTimeout(() => {
                sendNetData("SYNC_START", { hostName: myName });
                startRealGame();
            }, 1200);
        });

        function updateMyName() { 
            myName = document.getElementById("playerNameInput").value.trim() || "Ranger";
            document.getElementById("lblMyName").innerText = myName;
        }

        function copyRoomId() {
            navigator.clipboard.writeText(myPeerId);
            alert(`房號 ${myPeerId} 已複製到剪貼簿，快傳給朋友！`);
        }

        // 輸入代碼主動連線朋友
        function joinRoom() {
            const targetRoomId = document.getElementById("joinIdInput").value.trim();
            if(!targetRoomId) { alert("請輸入朋友的 5 位數房號！"); return; }
            document.getElementById("net-msg").innerText = "正在打通點對點連線隧道...";
            conn = peer.connect(targetRoomId);
            setupP2PConnection();
            document.getElementById("lblRoomState").innerText = "好友房(客端)";
        }

        // 盲刷全網隨機碰對
        function startMatchmaking() {
            document.getElementById("net-msg").innerText = "🔍 正在盲刷全網隨機房間...";
            let matchAttempts = 0;
            
            function scanNext() {
                matchAttempts++;
                if (matchAttempts > 15) {
                    document.getElementById("net-msg").innerText = "❌ 沒遇到合適對手，先按複製房號給朋友吧！";
                    return;
                }
                let testId = Math.floor(10000 + Math.random() * 89999).toString();
                if (testId === myPeerId) { scanNext(); return; }

                let testConn = peer.connect(testId);
                let timer = setTimeout(() => { testConn.close(); scanNext(); }, 350); // 快速碰撞

                testConn.on('open', () => {
                    clearTimeout(timer);
                    conn = testConn;
                    setupP2PConnection();
                    document.getElementById("lblRoomState").innerText = "隨機匹配房";
                    document.getElementById("net-msg").innerText = "⚔️ 成功撞車線上對手！";
                    setTimeout(() => {
                        sendNetData("SYNC_START", { hostName: myName });
                        startRealGame();
                    }, 800);
                });
            }
            scanNext();
        }

        // 配置連線封包接收管道
        function setupP2PConnection() {
            isMultiplayer = true;
            conn.on('data', (data) => {
                const packet = JSON.parse(data);
                if (packet.type === "SYNC_START") {
                    oppName = packet.payload.hostName;
                    document.getElementById("lblOppName").innerText = oppName;
                    sendNetData("SYNC_NAME_BACK", { guestName: myName });
                    startRealGame();
                }
                if (packet.type === "SYNC_NAME_BACK") {
                    oppName = packet.payload.guestName;
                    document.getElementById("lblOppName").innerText = oppName;
                }
                if (packet.type === "GAME_UPDATE") {
                    oppScore = packet.payload.score;
                    oppLevel = packet.payload.level;
                    oppTarget = packet.payload.target;
                }
                if (packet.type === "FIRE_EVENT") {
                    oppMouse.x = packet.payload.mx;
                    oppMouse.y = packet.payload.my;
                    oppLaserTimer = 6; // 渲染對手的彈道軌跡
                }
                if (packet.type === "FORCE_END") {
                    endGame(false, false, true);
                }
            });
            conn.on('close', () => {
                document.getElementById("net-msg").innerText = "📡 對手已斷開連線";
                if(isPlaying) endGame(false);
            });
        }

        function sendNetData(type, payload) {
            if (conn && conn.open) conn.send(JSON.stringify({ type: type, payload: payload }));
        }

        // -------------------------------------------------------------
        // 🎮 遊戲核心控制邏輯
        // -------------------------------------------------------------
        function localPracticeStart() {
            isMultiplayer = false;
            document.getElementById("lblRoomState").innerText = "LOCAL單機";
            document.getElementById("lblOppName").innerText = "無 (單機)";
            startRealGame();
        }

        function startRealGame() {
            if (isPlaying) return;
            score = 0; level = 1; hitsInLevel = 0; totalClicks = 0; successfulHits = 0; timeLeft = 120;
            oppScore = 0; oppLevel = 1; oppLaserTimer = 0;
            document.getElementById("lblTime").classList.remove("time-warning");
            
            document.getElementById("btnStart").disabled = true;
            document.getElementById("playerNameInput").disabled = true;

            startTime = performance.now();
            isPlaying = true;
            
            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - startTime) / 1000;
                timeLeft = (120 - elapsed).toFixed(2);
                if (timeLeft <= 20) document.getElementById("lblTime").classList.add("time-warning");

                if (timeLeft <= 0) {
                    timeLeft = "0.00";
                    document.getElementById("lblTime").innerText = timeLeft;
                    sendNetData("FORCE_END", {});
                    endGame(false, true);
                    return;
                }
                document.getElementById("lblTime").innerText = timeLeft;
                updateLiveUI();
            }, 150); // 優化效能刷新率

            spawnTarget();
        }

        function spawnTarget() {
            if (!isPlaying) return;
            clearTimeout(targetTimeout);
            const settings = levelSettings[level];
            
            target.z = Math.random() * (1.0 - 0.4) + 0.4; 
            const minX = 60 + (1 - target.z) * 60;
            const maxX = 320 - (1 - target.z) * 60;
            const minY = 90 + (1 - target.z) * 50;
            const maxY = 330 - (1 - target.z) * 50;

            target.x = Math.random() * (maxX - minX) + minX;
            target.y = Math.random() * (maxY - minY) + minY;
            target.radius = settings.radius * target.z;

            if (isMultiplayer) syncStatsToOpponent();

            targetTimeout = setTimeout(() => { spawnTarget(); }, settings.duration);
        }

        canvas.addEventListener("mousedown", (e) => {
            if (!isPlaying) return;
            totalClicks++;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const distance = Math.sqrt((mouseX - target.x) ** 2 + (mouseY - target.y) ** 2);

            if (distance <= target.radius) {
                successfulHits++; hitsInLevel++;
                let bonus = Math.round((1.1 - target.z) * 20);
                score += (level * 10) + bonus; 

                if (hitsInLevel >= levelSettings[level].requiredHits) {
                    if (level < 5) {
                        level++; hitsInLevel = 0;
                        ctx.fillStyle = "rgba(0, 255, 204, 0.3)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } else {
                        sendNetData("FORCE_END", {});
                        endGame(true); return;
                    }
                }
                spawnTarget();
            } else {
                score = Math.max(0, score - 5);
                ctx.strokeStyle = "rgba(255, 71, 87, 0.4)"; ctx.lineWidth = 6; ctx.strokeRect(0, 0, canvas.width, canvas.height);
            }
            if (isMultiplayer) {
                sendNetData("FIRE_EVENT", { mx: mouseX, my: mouseY });
                syncStatsToOpponent();
            }
            updateLiveUI();
        });

        function syncStatsToOpponent() {
            sendNetData("GAME_UPDATE", { score: score, level: level, target: target });
        }

        function updateLiveUI() {
            const req = levelSettings[level] ? levelSettings[level].requiredHits : 0;
            document.getElementById("lblLevel").innerText = level;
            document.getElementById("lblScore").innerText = score;
            document.getElementById("lblOppScore").innerText = oppScore;
            document.getElementById("lblTarget").innerText = `${hitsInLevel} / ${req}`;
        }

        function endGame(isWin, isTimeOut = false, forcedFromNet = false) {
            isPlaying = false;
            clearTimeout(targetTimeout); clearInterval(timerInterval);
            
            document.getElementById("btnStart").disabled = false;
            document.getElementById("playerNameInput").disabled = false;

            let title = "戰術模擬結束";
            let desc = `【我的得分】: ${score} 分 (通關進度: ${level} 關)`;
            
            if (isMultiplayer) {
                title = (score > oppScore) ? "👑 贏得線上對決勝利！" : (score < oppScore ? "❌ 線上對決落敗..." : "🤝 雙方平手！");
                desc += `\n【對手得分】: ${oppScore} 分 (${oppName})`;
            } else {
                if (checkHighScore(score)) {
                    saveHighScore(myName, score);
                    desc += `\n\n恭喜！此分數已登入本地神射手榜！`;
                }
            }

            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-desc").innerText = desc;
            document.getElementById("modal-overlay").style.display = "flex";
            
            showLeaderboard();
        }

        function closeModal() { document.getElementById("modal-overlay").style.display = "none"; }

        // -------------------------------------------------------------
        // 🎨 雙視窗 3D 繪圖渲染引擎 (完全繼承並等比適應原版透視)
        // -------------------------------------------------------------
        function draw3DScene(cCtx, w, h, tObj, isPlayerCanvas, lvl, nameLabel) {
            // 背景與消失點
            cCtx.fillStyle = "#0a0a10"; cCtx.fillRect(0, 0, w, h);
            cCtx.fillStyle = "#030305"; cCtx.fillRect(114, 126, 152, 168);
            cCtx.strokeStyle = isPlayerCanvas ? "#1b2a47" : "#5a3a10"; cCtx.lineWidth = 2;
            cCtx.strokeRect(114, 126, 152, 168);

            // 四角透視線
            cCtx.beginPath();
            cCtx.moveTo(0, 0); cCtx.lineTo(114, 126);
            cCtx.moveTo(w, 0); cCtx.lineTo(266, 126);
            cCtx.moveTo(0, h); cCtx.lineTo(114, 294);
            cCtx.moveTo(w, h); cCtx.lineTo(266, 294);
            cCtx.strokeStyle = isPlayerCanvas ? "#203a5e" : "#5e3a20"; cCtx.stroke();

            // 網格線
            cCtx.strokeStyle = isPlayerCanvas ? "rgba(0, 255, 204, 0.05)" : "rgba(255, 170, 0, 0.05)";
            for (let i = 1; i < 5; i++) {
                let r = i / 5; let x1 = 114 * r; let y1 = 126 * r;
                cCtx.strokeRect(x1, y1, w - x1 * 2, h - y1 * 2);
            }

            // 繪製靶與落地陰影
            if (isPlaying || (isMultiplayer && !isPlayerCanvas)) {
                const r = tObj.radius;
                cCtx.beginPath();
                cCtx.ellipse(tObj.x, Math.min(h - 20, tObj.y + 50), r, r * 0.2, 0, 0, Math.PI * 2);
                cCtx.fillStyle = "rgba(0, 0, 0, 0.4)"; cCtx.fill();

                cCtx.shadowBlur = 8; cCtx.shadowColor = isPlayerCanvas ? "#00ffcc" : "#ffaa00";
                cCtx.beginPath(); cCtx.arc(tObj.x, tObj.y, r, 0, Math.PI * 2);
                cCtx.fillStyle = isPlayerCanvas ? "#00ffcc" : "#ffaa00"; cCtx.fill();
                cCtx.shadowBlur = 0;

                cCtx.beginPath(); cCtx.arc(tObj.x, tObj.y, r * 0.6, 0, Math.PI * 2);
                cCtx.fillStyle = "#1a1a24"; cCtx.fill();

                cCtx.beginPath(); cCtx.arc(tObj.x, tObj.y, r * 0.25, 0, Math.PI * 2);
                cCtx.fillStyle = "#ff4757"; cCtx.fill();
            }

            // 浮水印標籤
            cCtx.fillStyle = isPlayerCanvas ? "rgba(0, 255, 204, 0.2)" : "rgba(255, 170, 0, 0.2)";
            cCtx.font = "bold 12px monospace"; cCtx.textAlign = isPlayerCanvas ? "right" : "left";
            cCtx.fillText(nameLabel.toUpperCase(), isPlayerCanvas ? w - 15 : 15, 25);
        }

        // 動畫主迴圈
        function renderLoop() {
            // 右邊視窗：玩家自身
            draw3DScene(ctx, canvas.width, canvas.height, target, true, level, `${myName} (YOU)`);
            
            // 左邊視窗：對手實時畫面
            draw3DScene(gCtx, ghostCanvas.width, ghostCanvas.height, oppTarget, false, oppLevel, `VS: ${oppName}`);
            
            if (isMultiplayer && isPlaying) {
                // 渲染對手開火軌跡
                if (oppLaserTimer > 0) {
                    gCtx.beginPath(); gCtx.moveTo(190, ghostCanvas.height); gCtx.lineTo(oppMouse.x, oppMouse.y);
                    gCtx.strokeStyle = `rgba(255, 170, 0, ${oppLaserTimer / 6})`; gCtx.lineWidth = 2; gCtx.stroke();
                    oppLaserTimer--;
                }
                // 渲染對手即時準心位置
                gCtx.strokeStyle = "rgba(255, 170, 0, 0.6)"; gCtx.lineWidth = 1;
                gCtx.beginPath(); gCtx.arc(oppMouse.x, oppMouse.y, 4, 0, Math.PI * 2); gCtx.stroke();
            }

            requestAnimationFrame(renderLoop);
        }

        // -------------------------------------------------------------
        // 🏆 排行榜 LocalStorage 控制
        // -------------------------------------------------------------
        function getLeaderboard() { const b = localStorage.getItem("aim_leaderboard_3d"); return b ? JSON.parse(b) : []; }
        function checkHighScore(s) { if (s === 0) return false; const b = getLeaderboard(); return b.length < 5 || s > b[b.length - 1].score; }
        function saveHighScore(n, s) {
            let b = getLeaderboard(); b.push({name: n, score: s, date: new Date().toLocaleDateString()});
            b.sort((x, y) => y.score - x.score); b = b.slice(0, 5);
            localStorage.setItem("aim_leaderboard_3d", JSON.stringify(b));
        }
        function showLeaderboard() {
            const b = getLeaderboard(); const listEl = document.getElementById("leaderList"); listEl.innerHTML = "";
            if (b.length === 0) { listEl.innerHTML = "<li>暫無資料</li>"; return; }
            b.forEach(item => { const li = document.createElement("li"); li.innerHTML = `<strong>${item.name}</strong> - ${item.score} 點 (${item.date})`; listEl.appendChild(li); });
        }

        // 啟動初始化
        showLeaderboard();
        renderLoop();
    </script>
</body>
</html>

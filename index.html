<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限射擊：3D模擬靶場練槍器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d12;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
        }

        #game-container {
            display: flex;
            gap: 20px;
            background-color: #1a1a24;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 220px;
        }

        .status-box {
            background-color: #09090d;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 5px solid #00ffcc;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .status-box span {
            font-weight: bold;
            color: #f1c40f;
            font-family: monospace;
        }

        .time-warning {
            color: #ff4757 !important;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        canvas {
            background-color: #050508;
            border: 3px solid #00ffcc;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }

        #leaderboard {
            background-color: #09090d;
            padding: 15px;
            border-radius: 8px;
            flex-grow: 1;
            margin-bottom: 15px;
            border: 1px solid #222;
        }

        #leaderboard h3 {
            margin-top: 0;
            color: #00ffcc;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 5px;
            font-size: 16px;
        }

        ol {
            padding-left: 20px;
            margin: 10px 0 0 0;
        }

        li {
            margin-bottom: 6px;
            font-size: 14px;
            color: #b3b3cc;
        }

        .btn {
            background-color: #00ffcc;
            color: #0d0d12;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .btn:hover {
            background-color: #00ccaa;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #modal {
            background: #1a1a24;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 30px rgba(0, 255, 204, 0.3);
            max-width: 400px;
            width: 80%;
            border: 2px solid #00ffcc;
        }

        #modal input {
            padding: 10px;
            width: 80%;
            margin: 15px 0;
            border: 1px solid #00ffcc;
            background: #09090d;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>TACTICAL SIMULATOR：3D 實境靶場 🎯</h1>
    
    <div id="game-container">
        <canvas id="aimCanvas" width="500" height="500"></canvas>

        <div id="info-panel">
            <div>
                <div class="status-box">目前關卡: <span id="lblLevel">1</span> / 5</div>
                <div class="status-box">當前分數: <span id="lblScore">0</span></div>
                <div class="status-box">擊中目標: <span id="lblTarget">0 / 10</span></div>
                <div class="status-box">精準度: <span id="lblAccuracy">100</span>%</div>
                <div class="status-box">剩餘時間: <span id="lblTime">120.00</span> 秒</div>
            </div>

            <div id="leaderboard">
                <h3>🏆 頂尖神射手排行</h3>
                <ol id="leaderList">
                    <li>暫無資料</li>
                </ol>
            </div>
            
            <button class="btn" id="btnStart" onclick="startGame()">開啟模擬訓練</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">訓練結束</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6;"></p>
            <div id="name-input-area" style="display:none;">
                <input type="text" id="playerName" placeholder="請輸入你的代號" maxlength="8">
            </div>
            <button class="btn" id="modalBtn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let level = 1;
        let hitsInLevel = 0;
        let totalClicks = 0;
        let successfulHits = 0;
        let startTime = 0;
        let timeLeft = 120; 
        
        let isPlaying = false;
        let targetTimeout;
        let timerInterval;

        // 預設靶心位置與立體景深Z軸 (0.1~1.0 越小代表越遠)
        let target = { x: 250, y: 220, radius: 35, z: 1.0 };

        const levelSettings = {
            1: { requiredHits: 10, radius: 25, duration: 1500 },
            2: { requiredHits: 12, radius: 21, duration: 1200 },
            3: { requiredHits: 15, radius: 17, duration: 950 },
            4: { requiredHits: 18, radius: 14, duration: 750 },
            5: { requiredHits: 20, radius: 10,  duration: 550 }
        };

        function resetGame() {
            score = 0;
            level = 1;
            hitsInLevel = 0;
            totalClicks = 0;
            successfulHits = 0;
            timeLeft = 120;
            document.getElementById("lblTime").classList.remove("time-warning");
            updateUI();
        }

        function startGame() {
            if (isPlaying) return;
            resetGame();
            isPlaying = true;
            
            document.getElementById("btnStart").disabled = true;
            document.getElementById("btnStart").style.backgroundColor = "#444";
            document.getElementById("btnStart").style.color = "#888";
            document.getElementById("btnStart").style.boxShadow = "none";
            
            startTime = performance.now();
            
            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - startTime) / 1000;
                timeLeft = (120 - elapsed).toFixed(2);

                if (timeLeft <= 20) {
                    document.getElementById("lblTime").classList.add("time-warning");
                }

                if (timeLeft <= 0) {
                    timeLeft = "0.00";
                    document.getElementById("lblTime").innerText = timeLeft;
                    endGame(false, true);
                    return;
                }
                document.getElementById("lblTime").innerText = timeLeft;
            }, 10);

            spawnTarget();
        }

        function spawnTarget() {
            if (!isPlaying) return;
            clearTimeout(targetTimeout);

            const settings = levelSettings[level];
            
            // 模擬隨機 3D 景深：隨機生成 Z 軸深度 (關卡越高，靶可能出現得越遠/越小)
            target.z = Math.random() * (1.0 - 0.4) + 0.4; 
            
            // 根據 Z 軸縮放實際可移動半徑，防止靶飄出立體牆面
            const minX = 100 + (1 - target.z) * 100;
            const maxX = 400 - (1 - target.z) * 100;
            const minY = 120 + (1 - target.z) * 80;
            const maxY = 380 - (1 - target.z) * 80;

            target.x = Math.random() * (maxX - minX) + minX;
            target.y = Math.random() * (maxY - minY) + minY;
            
            // 最終靶半徑受到關卡基礎大小與 3D 深度雙重影響
            target.radius = settings.radius * target.z;

            drawCanvas();

            targetTimeout = setTimeout(() => {
                spawnTarget();
            }, settings.duration);
        }

        // 繪製強烈 3D 景深場景
        function drawCanvas() {
            // 1. 背景基底
            ctx.fillStyle = "#0a0a10";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 繪製 3D 走廊消失點（遠方盡頭牆面）
            ctx.fillStyle = "#030305";
            ctx.fillRect(150, 150, 200, 200);
            ctx.strokeStyle = "#1b2a47";
            ctx.lineWidth = 2;
            ctx.strokeRect(150, 150, 200, 200);

            // 3. 繪製四條向中心延伸的立體透視線（牆角）
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(150, 150);       // 左上
            ctx.moveTo(500, 0); ctx.lineTo(350, 150);     // 右上
            ctx.moveTo(0, 500); ctx.lineTo(150, 350);     // 左下
            ctx.moveTo(500, 500); ctx.lineTo(350, 350);   // 右下
            ctx.strokeStyle = "#203a5e";
            ctx.stroke();

            // 4. 繪製兩側牆面與地板的縱深格線 (3D 網格特效)
            ctx.strokeStyle = "rgba(0, 255, 204, 0.07)";
            for (let i = 1; i < 5; i++) {
                let ratio = i / 5;
                let x1 = 150 * ratio;
                let x2 = 500 - (150 * ratio);
                let y1 = 150 * ratio;
                let y2 = 500 - (150 * ratio);

                // 畫橫向環繞框
                ctx.strokeRect(x1, y1, 500 - x1 * 2, 500 - y1 * 2);
            }

            // 5. 繪製打靶目標（帶有景深陰影）
            const r = target.radius;
            
            // 3D 落地投影陰影
            ctx.beginPath();
            let shadowY = 350 + (target.y - 150) * 0.4; // 簡單模擬地板投影
            ctx.ellipse(target.x, Math.min(480, shadowY + 60), r, r * 0.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fill();

            // 靶心外圈 (霓虹炫光效果)
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffcc";
            ctx.beginPath();
            ctx.arc(target.x, target.y, r, 0, Math.PI * 2);
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.shadowBlur = 0; // 恢復

            // 靶心中圈
            ctx.beginPath();
            ctx.arc(target.x, target.y, r * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = "#1a1a24";
            ctx.fill();

            // 靶心內圈中心點
            ctx.beginPath();
            ctx.arc(target.x, target.y, r * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = "#ff4757";
            ctx.fill();
        }

        canvas.addEventListener("mousedown", (e) => {
            if (!isPlaying) return;

            totalClicks++;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const distance = Math.sqrt((mouseX - target.x) ** 2 + (mouseY - target.y) ** 2);

            if (distance <= target.radius) {
                successfulHits++;
                hitsInLevel++;
                
                // 3D 加分機制：靶出現得越遠（Z越小），點到分數加越多！
                let bonus = Math.round((1.1 - target.z) * 20);
                score += (level * 10) + bonus; 

                const req = levelSettings[level].requiredHits;
                if (hitsInLevel >= req) {
                    if (level < 5) {
                        nextLevel();
                    } else {
                        endGame(true, false); 
                    }
                } else {
                    spawnTarget(); 
                }
            } else {
                score = Math.max(0, score - 5);
                drawFlashBorder(); 
            }
            updateUI();
        });

        function nextLevel() {
            level++;
            hitsInLevel = 0;
            updateUI();

            ctx.fillStyle = "rgba(0, 255, 204, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            isPlaying = false;
            setTimeout(() => {
                if(totalClicks > 0 && timeLeft > 0) { 
                    isPlaying = true;
                    spawnTarget();
                }
            }, 300);
        }

        function drawFlashBorder() {
            ctx.strokeStyle = "rgba(255, 71, 87, 0.4)";
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }

        function updateUI() {
            const req = levelSettings[level] ? levelSettings[level].requiredHits : 0;
            document.getElementById("lblLevel").innerText = level;
            document.getElementById("lblScore").innerText = score;
            document.getElementById("lblTarget").innerText = `${hitsInLevel} / ${req}`;
            
            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            document.getElementById("lblAccuracy").innerText = accuracy;
        }

        function endGame(isWin, isTimeOut = false) {
            isPlaying = false;
            clearTimeout(targetTimeout);
            clearInterval(timerInterval);
            
            document.getElementById("btnStart").disabled = false;
            document.getElementById("btnStart").style.backgroundColor = "#00ffcc";
            document.getElementById("btnStart").style.color = "#0d0d12";

            const accuracy = totalClicks === 0 ? 100 : Math.round((successfulHits / totalClicks) * 100);
            
            let title = "模擬結束";
            if (isWin) title = "⚡ 戰術特訓全通關！";
            else if (isTimeOut) title = "⏰ 時間截止！";
            
            const timeUsed = (120 - parseFloat(timeLeft)).toFixed(2);
            let desc = `最終得分：${score} 分\n通關進度：第 ${level} 關\n總計耗時：${timeUsed} 秒\n射擊精準度：${accuracy}%`;
            
            document.getElementById("modal-title").innerText = title;
            if (checkHighScore(score)) {
                desc += "\n\n成功登入神射手榜！請輸入代號：";
                document.getElementById("name-input-area").style.display = "block";
            } else {
                document.getElementById("name-input-area").style.display = "none";
            }
            
            document.getElementById("modal-desc").innerText = desc;
            document.getElementById("modal-overlay").style.display = "flex";
            
            target = { x: 250, y: 220, radius: 35, z: 1.0 };
            drawCanvas(); 
        }

        function closeModal() {
            const nameInput = document.getElementById("playerName");
            if (document.getElementById("name-input-area").style.display === "block") {
                const name = nameInput.value.trim() || "Ranger";
                saveHighScore(name, score);
                nameInput.value = "";
            }
            document.getElementById("modal-overlay").style.display = "none";
            showLeaderboard();
        }

        function getLeaderboard() {
            const board = localStorage.getItem("aim_leaderboard_3d");
            return board ? JSON.parse(board) : [];
        }

        function checkHighScore(currentScore) {
            if (currentScore === 0) return false;
            const board = getLeaderboard();
            if (board.length < 5) return true;
            return currentScore > board[board.length - 1].score;
        }

        function saveHighScore(name, currentScore) {
            let board = getLeaderboard();
            board.push({name: name, score: currentScore, date: new Date().toLocaleDateString()});
            board.sort((a, b) => b.score - a.score);
            board = board.slice(0, 5);
            localStorage.setItem("aim_leaderboard_3d", JSON.stringify(board));
        }

        function showLeaderboard() {
            const board = getLeaderboard();
            const listEl = document.getElementById("leaderList");
            listEl.innerHTML = "";
            if (board.length === 0) {
                listEl.innerHTML = "<li>暫無資料</li>";
                return;
            }
            board.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = `<strong>${item.name}</strong> - ${item.score} 點 (${item.date})`;
                listEl.appendChild(li);
            });
        }

        drawCanvas();
        showLeaderboard();
    </script>
</body>
</html>

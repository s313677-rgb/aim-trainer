<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限射擊：五關打靶練槍器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none; /* 防止頻繁點擊時選取到文字 */
        }

        h1 {
            margin-bottom: 10px;
            color: #e74c3c;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        #game-container {
            display: flex;
            gap: 20px;
            background-color: #2c2c35;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        #info-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 220px;
        }

        .status-box {
            background-color: #121216;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 5px solid #e74c3c;
        }

        .status-box span {
            font-weight: bold;
            color: #f1c40f;
            font-family: monospace;
        }

        /* 遊戲畫布：準心樣式 */
        canvas {
            background-color: #111116;
            border: 3px solid #444;
            border-radius: 6px;
            cursor: crosshair; /* 滑鼠游標變成十字準心 */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        #leaderboard {
            background-color: #121216;
            padding: 15px;
            border-radius: 6px;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        #leaderboard h3 {
            margin-top: 0;
            color: #3498db;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        ol {
            padding-left: 20px;
            margin: 10px 0 0 0;
        }

        li {
            margin-bottom: 6px;
            font-size: 14px;
        }

        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #c0392b;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        /* 彈出視窗 */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #modal {
            background: #2c2c35;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 80%;
            border: 1px solid #e74c3c;
        }

        #modal input {
            padding: 10px;
            width: 80%;
            margin: 15px 0;
            border: 1px solid #444;
            background: #121216;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>AIM TRAINER：極限打靶 🎯</h1>
    
    <div id="game-container">
        <canvas id="aimCanvas" width="500" height="500"></canvas>

        <div id="info-panel">
            <div>
                <div class="status-box">目前關卡: <span id="lblLevel">1</span> / 5</div>
                <div class="status-box">當前分數: <span id="lblScore">0</span></div>
                <div class="status-box">擊中目標: <span id="lblTarget">0 / 10</span></div>
                <div class="status-box">精準度: <span id="lblAccuracy">100</span>%</div>
                <div class="status-box">時間: <span id="lblTime">0.00</span> 秒</div>
            </div>

            <div id="leaderboard">
                <h3>🏆 前五名神射手</h3>
                <ol id="leaderList">
                    <li>暫無資料</li>
                </ol>
            </div>
            
            <button class="btn" id="btnStart" onclick="startGame()">開始訓練</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">訓練結束</h2>
            <p id="modal-desc" style="white-space: pre-line; line-height: 1.6;"></p>
            <div id="name-input-area" style="display:none;">
                <input type="text" id="playerName" placeholder="請輸入你的代號 (最多8字)" maxlength="8">
            </div>
            <button class="btn" id="modalBtn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("aimCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲核心變數
        let score = 0;
        let level = 1;
        let hitsInLevel = 0;
        let totalClicks = 0;
        let successfulHits = 0;
        let startTime = 0;
        let timeElapsed = 0;
        
        let isPlaying = false;
        let targetTimeout;
        let timerInterval;

        // 當前靶的資訊
        let target = { x: 0, y: 0, radius: 0 };

        // 關卡設定：[關卡] = { 目標擊中數, 靶半徑, 靶停留時間(ms) }
        const levelSettings = {
            1: { requiredHits: 10, radius: 25, duration: 1500 },
            2: { requiredHits: 12, radius: 20, duration: 1200 },
            3: { requiredHits: 15, radius: 15, duration: 950 },
            4: { requiredHits: 18, radius: 11, duration: 750 },
            5: { requiredHits: 20, radius: 7,  duration: 550 } // 地獄級
        };

        // 初始化/重置遊戲
        function resetGame() {
            score = 0;
            level = 1;
            hitsInLevel = 0;
            totalClicks = 0;
            successfulHits = 0;
            timeElapsed = 0;
            updateUI();
        }

        // 開始遊戲
        function startGame() {
            if (isPlaying) return;
            resetGame();
            isPlaying = true;
            
            // 停用按鈕
            document.getElementById("btnStart").disabled = true;
            document.getElementById("btnStart").style.backgroundColor = "#7f8c8d";
            
            startTime = performance.now();
            
            // 啟動精準計時器 (每10毫秒更新一次小數點)
            timerInterval = setInterval(() => {
                timeElapsed = ((performance.now() - startTime) / 1000).toFixed(2);
                document.getElementById("lblTime").innerText = timeElapsed;
            },
